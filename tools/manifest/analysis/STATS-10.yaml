    analysis:
      adapter: scripts.stages.stats:analyse_validation
      mode: LIVE
      typical_seconds: 2.0
      summary: >-
        The confusion matrix and its metrics at a threshold you choose. The default is
        the threshold selected on the training split; override it and the response says
        so, because a threshold picked by looking at evaluation metrics is not a
        selection procedure.
      inputs:
        - name: arm
          kind: select
          label: Arm
          default: FULL
          options:
            - FULL
            - NO_TEXT
            - NO_IMAGE
            - NO_AUDIO
            - NO_VIDEO
            - NO_MARKET
            - NO_MICROSTRUCTURE
            - NO_REGIME
            - NO_PROPAGATION
            - NO_AFFECTIVE
            - NO_UNCERTAINTY
            - TEXT_ONLY
            - IMAGE_ONLY
            - AUDIO_ONLY
            - VIDEO_ONLY
            - MARKET_ONLY
            - MARKET_MICRO
            - ALL_MEDIA
            - ALL_MEDIA_MARKET
            - FUSION_STATIC
            - FUSION_EARLY
            - FUSION_LATE
            - FUSION_UNCERTAINTY
            - FUSION_REGIME_INHERITED
            - FUSION_REGIME_CORRECTED
          note: >-
            which experimental arm's per-row scores to read
        - name: threshold
          kind: float
          label: Threshold
          default: null
          minimum: 0.0
          maximum: 1.0
          note: >-
            leave empty to use the training-selected threshold
        - name: date_from
          kind: date
          label: From
          default: '2019-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first scored session
        - name: date_to
          kind: date
          label: To
          default: '2026-08-14'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last scored session
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range
