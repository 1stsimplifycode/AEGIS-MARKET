    analysis:
      adapter: scripts.stages.multimodal:analyse_image_block
      mode: LIVE
      typical_seconds: 1.2
      summary: >-
        Per-feature presence and dispersion for the image block on the rows you select.
        Every one of these features is computed from a chart rendered from market data.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first session described
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last session described
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range
        - name: split
          kind: select
          label: Split
          default: all
          options:
            - all
            - train
            - validation
            - holdout
          note: >-
            which split to describe
