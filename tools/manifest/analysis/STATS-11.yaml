    analysis:
      adapter: scripts.stages.stats:analyse_calibration
      mode: LIVE
      typical_seconds: 2.0
      summary: >-
        The reliability curve at a binning you choose. Expected calibration error
        depends on the bin count, so the control is exposed rather than fixed: an ECE
        quoted without its binning is a number nobody can check.
      inputs:
        - name: arm
          kind: select
          label: Arm
          default: FULL
          options:
            - FULL
            - NO_TEXT
            - NO_IMAGE
            - NO_AUDIO
            - NO_VIDEO
            - NO_MARKET
            - NO_MICROSTRUCTURE
            - NO_REGIME
            - NO_PROPAGATION
            - NO_AFFECTIVE
            - NO_UNCERTAINTY
            - TEXT_ONLY
            - IMAGE_ONLY
            - AUDIO_ONLY
            - VIDEO_ONLY
            - MARKET_ONLY
            - MARKET_MICRO
            - ALL_MEDIA
            - ALL_MEDIA_MARKET
            - FUSION_STATIC
            - FUSION_EARLY
            - FUSION_LATE
            - FUSION_UNCERTAINTY
            - FUSION_REGIME_INHERITED
            - FUSION_REGIME_CORRECTED
          note: >-
            whose scores to assess
        - name: bins
          kind: int
          label: Bins
          default: 10
          minimum: 2
          maximum: 50
          note: >-
            few bins hide miscalibration inside them; many put too few rows in each
        - name: date_from
          kind: date
          label: From
          default: '2019-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first scored session
        - name: date_to
          kind: date
          label: To
          default: '2026-08-14'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last scored session
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range
