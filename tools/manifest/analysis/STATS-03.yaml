    analysis:
      adapter: scripts.stages.stats:analyse_distributions
      mode: LIVE
      typical_seconds: 1.5
      summary: >-
        Describes every numeric feature on the rows you select, and names the ones that
        are constant there. A feature that cannot vary on this slice cannot inform
        anything computed from it, however useful it is elsewhere.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first session described
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last session described
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range
        - name: block
          kind: select
          label: Feature block
          default: all
          options:
            - all
            - text
            - image
            - audio
            - video
            - market
            - microstructure
            - regime
            - propagation
          note: >-
            restrict the description to one modality block
        - name: split
          kind: select
          label: Split
          default: all
          options:
            - all
            - train
            - validation
            - holdout
          note: >-
            the frozen holdout is described but never scored
