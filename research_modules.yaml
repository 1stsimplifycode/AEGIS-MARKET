    depends_on: [STATS-13]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-04, L-11]
    notes: >-
      Implemented in the metrics commit. The suite lives in the canonical metrics module
      alongside the detection metrics, not in a parallel framework, and reproduces the
      precision, recall and F1 already recorded in the FULL experiment bundle to within
      1e-12. The operating threshold is read from that bundle, where it was chosen on the
      training split: recomputing it from the evaluation scores would be threshold
      provenance leakage (L6). Results describe synthetic episodes on the validation
      split; the holdout remains frozen (L-11).
    ui:
      icon: ✓
      product_name: How accurate the signal is
      route: /stats/validation
      product_headline: How reliable the model is on held-out rows
      product_question: How often is the model right, how often is it wrong, and in which direction?
      product_actions:
      - Read the confusion matrix and the per-class rates
      - Compare precision against recall at the operating threshold
      - See the class balance the metrics are computed against
      product_observation: 'At the operating threshold the model reaches high precision with
        a lower recall: it misses more episodes than it invents.'
      product_risk: Measured on injected episodes in the validation split (L-04, L-11). The
        frozen holdout has not been evaluated, so nothing here describes performance beyond
        that split.
      confidence: MODERATE
      visual: confusion
      product_metrics:
      - label: Balanced accuracy
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.balanced_accuracy
        format: float4
        note: mean of the two class recalls
      - label: Precision
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.precision
        format: float4
        note: of flagged instrument-days
      - label: Recall
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.recall
        format: float4
        note: of episode rows found
      - label: F1
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.f1
        format: float4
        note: harmonic mean of the two
      research_metrics:
      - label: True positives
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.tp
        format: int
      - label: False positives
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.fp
        format: int
      - label: False negatives
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.fn
        format: int
      - label: Matthews correlation
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.mcc
        format: float4
      - label: Specificity
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.specificity
        format: float4
      - label: Operating threshold
        value: json:outputs/stats/10_validation_verification/verification_metrics.json#metrics.threshold
        format: float4
      figures:
      - fig13_precision_recall
      tables:
      - table10_error_analysis
      inputs:
      - kind: split
        label: Split
        note: 'Validation. The holdout is frozen and cannot be selected: evaluating it would
          spend the one look this project has.'
    analysis:
      adapter: scripts.stages.stats:analyse_validation
      mode: LIVE
