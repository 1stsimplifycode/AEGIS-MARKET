        value: json:outputs/stats/09_leakage_verification/leakage_report.json#returncode
        format: int
        note: zero is the only acceptable value
      research_metrics:
      - label: Suite
        value: json:outputs/stats/09_leakage_verification/leakage_report.json#suite
        format: text
      - label: Interpretation
        value: json:outputs/stats/09_leakage_verification/leakage_report.json#interpretation
        format: text
      figures: []
      tables: []
    analysis:
      adapter: scripts.stages.stats:analyse_leakage
      mode: LIVE
      typical_seconds: 10.0
      summary: >-
        Runs the L1-L6 leakage suite now and reports what it found. No parameters: a
        leakage check whose scope the requester can narrow is not a leakage check.
      inputs: []

  - id: STATS-10
    index: 10
    category: STATS
    slug: validation_verification
    name: Validation and verification metrics
    purpose: >-
      The full classification verification suite the current metrics module lacks:
      confusion matrix with TP/TN/FP/FN, accuracy, balanced accuracy, specificity,
      Matthews correlation coefficient, false-positive and false-negative rates, and
      per-class performance.
    research_question: >-
      Beyond ranking quality, how does the detector behave at its operating point, and how
      is that behaviour distributed across the error types?
    canonical:
