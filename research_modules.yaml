  - id: SCENARIO-05
    index: 5
    category: SCENARIO
    slug: scenario_uncertainty
    name: Scenario uncertainty
    purpose: Report every scenario difference with the interval around it, the test that produced
      the interval, and the number of assumptions the result rests on, so an unresolved difference
      is visible as unresolved.
    research_question: Which scenario differences does this evidence separate from zero, and
      which does it leave unresolved?
    canonical:
    - research/statistics/tests.py::paired_bootstrap_difference
    - research/scenario/engine.py::ScenarioEngine
    adapter: scripts.stages.scenario:scenario_uncertainty
    inputs:
    - outputs/scenario/scenario_uncertainty.csv
    outputs:
    - outputs/scenario/scenario_uncertainty.csv
    depends_on:
    - SCENARIO-02
    - SCENARIO-03
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations:
    - L-12
    - L-24
    notes: Clusters are instruments on the market track and accounts on the transaction track,
      because two rows sharing either are not independent draws. An interval that excludes zero
      establishes a difference under the scenario's assumptions, not the assumptions themselves.
    ui:
      icon: ◐
      product_name: Mitigation conditions
      route: /scenario/uncertainty
      product_headline: Which scenario differences the data actually separates
      product_question: For each condition, is the difference from the baseline larger than
        the noise around it?
      product_actions:
      - Read every scenario difference with its interval side by side
      - Separate the established differences from the unresolved ones
      - Check how many assumptions each result rests on
      product_observation: Fourteen differences are measured and twelve carry a sampling interval.
        Nine of those exclude zero; the liquidity stratum, the processing delay and the transaction
        enrichment outage do not, and are reported as unresolved rather than as an established
        absence. Two referral thresholds are deterministic on fixed scores and carry no interval
        at all.
      product_risk: An interval that excludes zero establishes a difference under the scenario's
        own assumptions. It does not establish that the assumption holds.
      confidence: HIGH
      visual: uncertainty_intervals
      product_metrics:
      - label: Differences measured
        value: csv:outputs/scenario/scenario_uncertainty.csv#rows
        format: int
        note: one per non-baseline scenario
      - label: Widest interval
        value: csv:outputs/scenario/scenario_uncertainty.csv#agg:ci_high:max
        format: float4
        note: upper edge across all scenarios
      - label: Largest effect
        value: csv:outputs/scenario/scenario_uncertainty.csv#agg:estimate:max
        format: float4
        note: biggest positive difference from baseline
      - label: Smallest effect
        value: csv:outputs/scenario/scenario_uncertainty.csv#agg:estimate:min
        format: float4
        note: biggest negative difference from baseline
      research_metrics:
      - label: Scenarios carrying assumptions
        value: csv:outputs/scenario/scenario_uncertainty.csv#agg:n_assumptions:sum
        format: int
      - label: Largest p-value
        value: csv:outputs/scenario/scenario_uncertainty.csv#agg:p_value:max
        format: float4
      - label: Smallest p-value
        value: csv:outputs/scenario/scenario_uncertainty.csv#agg:p_value:min
        format: float4
      figures:
      - figS03_scenario_uncertainty
      - figS04_scenario_sensitivity
      tables:
      - table15_scenario_uncertainty

  - id: SCENARIO-06
    index: 6
    category: SCENARIO
    slug: scenario_ablation
    name: Scenario ablation
    purpose: Re-run the whole market catalogue under five modality subsets and report whether
      each scenario's effect keeps the direction it had on the full stack.
    research_question: Is a scenario conclusion a property of the condition, or of one modality
      block happening to be present?
    canonical:
    - research/scenario/market.py::ABLATION_SUBSETS
    - research/scenario/engine.py::ScenarioEngine
    adapter: scripts.stages.scenario:scenario_ablation
    inputs:
