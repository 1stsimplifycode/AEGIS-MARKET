    adapter: scripts.stages.multimodal:modality_information
    inputs:
      - research_artifacts/experiments
    outputs:
      - outputs/multimodal/14_modality_information/decomposition.csv
    depends_on: [MULTIMODAL-13]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: EXP-ABL-1
    limitations: []
    notes: >-
      Reads the per-arm artifacts produced by STATS-13/14; it does not refit anything.
    ui:
      icon: ◈
      product_name: What each kind of evidence adds
      route: /multimodal/modality-information
      product_headline: What each modality knows that the others do not
      product_question: Is a modality contributing unique information, re-encoding what another
        already carries, or conflicting with it?
      product_actions:
      - Compare unique against redundant contribution per modality
      - See where two modalities disagree with the fused decision
      - Read this before attributing a result to a modality
      product_observation: Text and market carry substantial unique information. The rendered
        image, audio and video channels carry almost none beyond the market block, which is
        what a redundant view of the same series looks like.
      product_risk: 'This is an operational decomposition in the metric that matters, not a
