    ui:
      icon: ◱
      product_name: Real market conditions
      route: /scenario/market-conditions
      product_headline: How the model reads sessions that really were stressed
      product_question: Does the integrity-risk estimate behave differently on sessions that
        were genuinely volatile or genuinely thin?
      product_actions:
      - Compare the model's reading on stressed sessions against the whole split
      - Check whether the difference is separated from zero
      - See how many sessions each condition selects
      product_observation: On the fifth of sessions with the highest realised volatility the
        mean risk estimate is 0.0561 lower than on the split as a whole, with an interval excluding
        zero and the same sign in every seed. The estimate is not reading volatility back. The
