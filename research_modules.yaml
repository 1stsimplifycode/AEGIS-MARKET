  - id: STATS-15
    index: 15
    category: STATS
    slug: robustness_generalization
    name: Robustness and generalization
    purpose: >-
      Performance under feature noise, input corruption, induced missingness and reduced
      training data, and transfer across time periods and across disjoint instrument sets.
    research_question: >-
      Where does the detector stop being reliable, and does it transfer beyond the
      instruments and period it was fitted on?
    canonical:
      - research/evaluation/robustness.py
      - scripts/run_robustness_generalization.py
    adapter: scripts.stages.stats:robustness_generalization
    inputs:
      - data/panel/multimodal_dataset.parquet
    outputs:
      - outputs/stats/15_robustness_generalization/robustness.csv
      - outputs/stats/15_robustness_generalization/generalization.csv
      - outputs/stats/15_robustness_generalization/run.json
    depends_on: [STATS-13]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: [L-11]
    notes: >-
      Five axes execute: additive noise, value dropout, stale feed, outlier injection and
      per-modality blackout on the evaluation inputs; a symbol-level training-size curve;
      expanding-window transfer forward in time; and transfer to disjoint tickers. The
      model is fitted once on clean data for the input-degradation axis, because refitting
      on corrupted data measures whether the learner adapts, which is an easier and
      different question than what a deployed model does when its feed degrades. Training
      subsampling drops whole symbols rather than random rows: rows from one instrument
      are serially dependent, so row-level dropping leaves nearly every instrument
      represented and understates how much the model depends on breadth. The frozen
      holdout is never read -- assert_no_holdout() raises on any frame carrying holdout
      rows and every fit passes through it. Cross-dataset transfer remains BLOCKED and is
      reported as such, because only one dataset exists. Adversarial robustness is NOT
      RUN: every corruption here is random, and an adversarial claim needs a threat model.
    ui:
      icon: ⊘
      product_name: What happens when data degrades
      route: /stats/robustness
      product_headline: How stable the result is when the inputs degrade
      product_question: How much does performance fall when features are noisy, stale, missing,
        or when there is less training data?
      product_actions:
      - Compare each corruption family against the clean reference
      - Read the learning curve to see whether more data would help
      - Check transfer across time folds and across instrument groups
      product_observation: Additive noise is the worst input failure and a stale feed the mildest.
        Transfer to disjoint instruments is close to in-sample; transfer forward in time is
        weaker and improves as history accumulates.
      product_risk: Every corruption here is random or structural. Adversarial robustness is
        NOT RUN and is a different property that needs an attacker model.
      confidence: MODERATE
      visual: robustness_lines
      product_metrics:
      - label: Conditions tested
        value: json:outputs/stats/15_robustness_generalization/run.json#robustness_rows
        format: int
        note: corruption family by severity
      - label: Worst degradation
        value: json:outputs/stats/15_robustness_generalization/run.json#worst_degradation.degradation
        format: float4
        note: AUPRC lost in the worst condition
      - label: Instrument transfer
        value: json:outputs/stats/15_robustness_generalization/run.json#instrument_transfer.auprc_mean
        format: float4
        note: mean AUPRC on held-out instruments
      - label: Forward-in-time transfer
        value: json:outputs/stats/15_robustness_generalization/run.json#period_transfer.auprc_mean
        format: float4
        note: mean AUPRC on later periods
      research_metrics:
      - label: Worst corruption
        value: json:outputs/stats/15_robustness_generalization/run.json#worst_degradation.corruption
        format: text
      - label: Instrument transfer range (min)
        value: json:outputs/stats/15_robustness_generalization/run.json#instrument_transfer.auprc_min
        format: float4
      - label: Period transfer range (min)
        value: json:outputs/stats/15_robustness_generalization/run.json#period_transfer.auprc_min
        format: float4
      - label: Second-dataset transfer
        value: json:outputs/stats/15_robustness_generalization/run.json#dataset_transfer.status
        format: text
      - label: Adversarial robustness
        value: json:outputs/stats/15_robustness_generalization/run.json#adversarial_robustness
        format: text
      - label: Holdout policy
        value: json:outputs/stats/15_robustness_generalization/run.json#holdout_policy
        format: text
      figures:
      - figR04_stats_input_robustness
      - figR05_stats_learning_curve
      - figR06_stats_generalization
      tables:
      - table08_robustness
      inputs:
      - kind: corruption
        label: Corruption family
        note: Choose which degradation family to chart. All families are pre-computed; nothing
          is re-run here.
    analysis:
      adapter: scripts.stages.stats:analyse_robustness
      mode: LIVE
      typical_seconds: 65.0
      summary: >-
        One perturbation condition, run now: the model is fitted on clean data and
        scored on degraded inputs. Fitting once is the point — refitting on corrupted
        data asks whether the learner adapts, which is not what a degraded feed does to
        a deployed model.
      inputs:
        - name: corruption
          kind: select
          label: Failure mode
          default: gaussian
          options:
            - gaussian
            - dropout
            - stale
            - outliers
          note: >-
            stale is a delayed feed, which is more common in production than noise and
            invisible to a null check
        - name: severity
          kind: float
          label: Severity
          default: 0.1
          minimum: 0.01
          maximum: 0.5
          note: >-
            the fraction of values affected, or the noise scale
        - name: modality
          kind: select
          label: Applied to
          default: all
          options:
            - all
            - text
            - image
            - audio
            - video
            - market
            - microstructure
            - regime
            - propagation
          note: >-
            degrade every feature, or only one block's
        - name: seed
          kind: int
          label: Seed
          default: 20260818
          minimum: 1
          maximum: 99999999
          note: >-
            changing it changes which values are hit

  - id: STATS-16
    index: 16
    category: STATS
    slug: multiseed_significance
    name: Multi-seed and statistical significance
    purpose: >-
      Repeat the stochastic parts of the pipeline across seeds and report mean, standard
      deviation, minimum, maximum and 95% confidence interval, then apply the existing
      cluster bootstrap, paired permutation, Benjamini-Hochberg correction and power
      analysis to the repeated measurements.
    research_question: >-
      How much of the reported difference between arms is seed variance rather than signal?
    # `will_consume:` used to sit here, listing the statistics machinery separately from
    # `canonical:` because no driver called it yet. The driver now exists and the adapter
    # runs it, so that machinery has moved into `canonical:` where it belongs.
    canonical:
      - research/evaluation/multiseed.py
      - scripts/run_multiseed.py
      - research/statistics/tests.py
      - research/statistics/power.py
    adapter: scripts.stages.stats:multiseed_significance
    inputs:
      - data/panel/multimodal_dataset.parquet
    outputs:
      - outputs/stats/16_multiseed_significance/seed_table.csv
      - outputs/stats/16_multiseed_significance/significance.json
      - outputs/stats/16_multiseed_significance/seed_summary.csv
      - outputs/stats/16_multiseed_significance/paired_tests.csv
    depends_on: [STATS-13, STATS-14]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-12]
    notes: >-
      Every ablation arm is refitted across a declared seed ladder and the repeated
      measurements are handed to the machinery that already existed: cluster bootstrap,
      paired sign-flip permutation and Benjamini-Hochberg. Two sources of variation are
      kept apart, because conflating them is how a seed study overstates its own
      precision -- spread across seeds on one fixed evaluation set is seed variance, and
      the cluster bootstrap interval within one run is sampling variance of the evaluation
      set. A pooled seed noise floor is reported, and an arm difference smaller than that
      floor is recorded as not established however it looked in a single run. Differences
      that dissolve are listed alongside the ones that survive rather than filtered out.
      Validation only: repeating a measurement on the frozen holdout across ten seeds
      would be ten looks at the data the freeze exists to protect.
    ui:
      icon: ⊛
      product_name: What counts as a real difference
      route: /stats/multi-seed
      product_headline: How much of a difference is just the random seed
      product_question: Is an observed difference between two arms bigger than what re-seeding
        alone produces?
      product_actions:
      - Read the seed noise floor before comparing any two arms
      - See which differences survive multiplicity correction across seeds
      - Check the minimum detectable effect before reading a null result
      product_observation: Every arm was refitted across ten seeds. A difference smaller than
        the 95% seed noise floor is inside what re-seeding alone produces and is not established
        by this experiment.
      product_risk: The floor is computed on the validation split and does not extend to the
        frozen holdout (L-11). Repeating the measurement there would be ten looks at data that
        gets one.
      confidence: HIGH
      visual: seed_spread
      product_metrics:
      - label: Arms
        value: json:outputs/stats/16_multiseed_significance/significance.json#n_arms
        format: int
        note: refitted per seed
      - label: Seeds
        value: json:outputs/stats/16_multiseed_significance/significance.json#n_seeds
        format: int
        note: independent refits per arm
      - label: Seed noise floor (95%)
        value: json:outputs/stats/16_multiseed_significance/significance.json#seed_noise_floor.noise_floor_95
        format: float4
        note: smallest difference this experiment can establish
      - label: Differences established
        value: json:outputs/stats/16_multiseed_significance/significance.json#differences_surviving_correction
        format: count
        note: after correction
      research_metrics:
      - label: Pooled seed standard deviation
        value: json:outputs/stats/16_multiseed_significance/significance.json#seed_noise_floor.pooled_seed_sd
        format: float5
      - label: Fits executed
        value: json:outputs/stats/16_multiseed_significance/significance.json#n_fits
        format: int
      - label: Differences inside the noise floor
        value: json:outputs/stats/16_multiseed_significance/significance.json#differences_within_seed_noise
        format: count
      - label: Minimum detectable effect
        value: json:outputs/stats/16_multiseed_significance/significance.json#minimum_detectable_effect.minimum_detectable_effect
        format: float5
      - label: Holdout policy
        value: json:outputs/stats/16_multiseed_significance/significance.json#holdout_policy
        format: text
      figures:
      - figR07_seed_variability
      tables:
      - table06_multiseed
      - table13_statistical_significance
    analysis:
      adapter: scripts.stages.stats:analyse_seed_noise
      mode: LIVE
      typical_seconds: 50.0
      summary: >-
        Derives the seed noise floor over the arms you select and tests every pair
        against it. A difference smaller than the floor is not a small effect: it is not
        distinguishable from rerunning the same arm with a different seed.
      inputs:
        - name: arms
          kind: multiselect
          label: Arms
          default: []
          max_items: 40
          options:
            - FULL
            - NO_TEXT
            - NO_IMAGE
            - NO_AUDIO
            - NO_VIDEO
            - NO_MARKET
            - NO_MICROSTRUCTURE
            - NO_REGIME
            - NO_PROPAGATION
            - NO_AFFECTIVE
            - NO_UNCERTAINTY
            - TEXT_ONLY
            - IMAGE_ONLY
            - AUDIO_ONLY
            - VIDEO_ONLY
            - MARKET_ONLY
            - MARKET_MICRO
            - ALL_MEDIA
            - ALL_MEDIA_MARKET
            - FUSION_STATIC
            - FUSION_EARLY
            - FUSION_LATE
            - FUSION_UNCERTAINTY
            - FUSION_REGIME_INHERITED
            - FUSION_REGIME_CORRECTED
          note: >-
            leave empty to use every arm with completed seed fits
        - name: alpha
          kind: float
          label: Alpha
          default: 0.05
          minimum: 0.01
          maximum: 0.2
          note: >-
            the level the Benjamini-Hochberg correction controls at

  - id: HUMAN_AFFECT-09
    index: 9
    category: HUMAN_AFFECT
    slug: vlm_visual_observation
    name: Vision-language observation of human video
    purpose: >-
      Run open vision-language models over real human video frames and store structured,
      observation-grounded records of what is visible.
    research_question: >-
      What does a general vision-language model report about a face that a five-landmark
      geometry does not measure, and how stable is that report?
    canonical:
      - research/vlm/__init__.py
      - research/vlm/models.py
      - scripts/run_vlm_experiments.py
    adapter: scripts.stages.human_affect:vlm_visual_observation
    inputs:
      - outputs/vlm/vlm_run.json
    outputs:
      - outputs/human_affect/09_vlm_visual_observation/vlm_visual.json
    depends_on: [HUMAN_AFFECT-06]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-08, L-09]
    notes: >-
      Prompts ask only for observable evidence and a guard refuses any prompt asking a
      vision model to infer deception, identity, employment suitability, clinical state or
      an investment action -- the refusal fires before the model is loaded, because such a
      model answers those questions fluently and the answer is indistinguishable in form
      from a description of a mouth. Output is structured, not prose alone. The token
      log-probability is stored under its own name and is never presented as a calibrated
      confidence. Hardware is CPU-only, so the models are on-device SmolVLM at 256M and
      500M and the frames are a stratified sample rather than the whole corpus; the
      evaluated subset size is reported beside every result.

  - id: HUMAN_AFFECT-10
    index: 10
    category: HUMAN_AFFECT
    slug: vlm_ablation
    name: Vision-language against the specialised facial model
    purpose: >-
      Score every subset of the facial, vision-language, acoustic and lexical channels on
      the frames the vision-language model actually processed.
    research_question: >-
      Does a vision-language representation add information beyond specialised facial
      geometry, alone and alongside the other modalities?
    canonical:
      - scripts/run_vlm_ablation.py
    adapter: scripts.stages.human_affect:vlm_ablation
    inputs:
      - outputs/vlm/vlm_descriptions.csv
    outputs:
      - outputs/human_affect/10_vlm_ablation/vlm_ablation.json
    depends_on: [HUMAN_AFFECT-09]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-08, L-09]
    notes: >-
      Leave-one-actor-out cross-validation over the vision-language subset, so every fold
      is speaker-disjoint and no clip is wasted on a further split the sample cannot
      afford. The vision-language representation is deliberately shallow -- which regions
      the description mentioned, its length, its unsupported-language count and the
      model's own token likelihood -- because the question is whether the visual
      observations carry signal, not whether a language model can be trained on captions.

  - id: HUMAN_AFFECT-11
    index: 11
    category: HUMAN_AFFECT
    slug: multimodal_multiseed
    name: Multi-seed evaluation of every modality arm
    purpose: >-
      Repeat every modality subset across five seeds on two tiers and report mean,
      standard deviation, min, max and a 95% interval for each.
    research_question: >-
      Which multimodal gains survive re-seeding, and which are inside the variation the
      pipeline produces on its own?
    canonical:
      - scripts/run_multimodal_multiseed.py
    adapter: scripts.stages.human_affect:multimodal_multiseed
    inputs:
      - outputs/multimodal_multiseed/multimodal_multiseed.json
    outputs:
      - outputs/human_affect/11_multimodal_multiseed/multiseed.json
    depends_on: [HUMAN_AFFECT-07]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    execution: VERIFIED
    experiment_id: null
    limitations: [L-08, L-09]
    notes: >-
      Two tiers because the vision-language channel covers only part of the corpus and
      shrinking every other arm to match it would waste 640 clips. The full tier is 720
      performances over 12 actors; the vision-language tier is the 80 clips a VLM actually
      processed. Both are leave-one-actor-out, so every clip is used and no fold scores a
      person it trained on. Seeds vary only the learner, so the reported spread is seed
      variance and nothing else.

  - id: HUMAN_AFFECT-12
    index: 12
    category: HUMAN_AFFECT
    slug: fusion_strategies
    name: Fusion-rule comparison
    purpose: >-
      Compare early, late, validation-weighted and uncertainty-weighted fusion against an
      uninformative control on one corpus, one metric and one split.
    research_question: >-
      Does the choice of fusion rule matter more than the seed?
    canonical:
      - scripts/run_fusion_strategies.py
    adapter: scripts.stages.human_affect:fusion_strategies
    inputs:
      - outputs/human_affect/experiments/fusion_strategies.json
    outputs:
      - outputs/human_affect/12_fusion_strategies/fusion_strategies.json
    depends_on: [HUMAN_AFFECT-11]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    execution: VERIFIED
    experiment_id: null
    limitations: [L-08]
    notes: >-
      Fusion weights are fitted on out-of-bag posteriors, not on in-bag ones. The first
      run fitted them against the forest's predictions on its own training rows, which are
      close to memorised, and the grid duly collapsed to a degenerate face-only solution
      scoring exactly what face-alone scores. That is how the defect announced itself.
      With out-of-bag posteriors the weighted arm rises from 0.3885 to 0.5292 and the four
      real rules land within the seed noise floor of one another, so the module reports
      PARTIAL: no rule is established as best on this corpus at this sample size.

  - id: HUMAN_AFFECT-13
    index: 13
    category: HUMAN_AFFECT
    slug: multimodal_robustness
    name: Degradation, missing modalities and misalignment
    purpose: >-
      Degrade each modality, remove each modality, and destroy the audio-video
      correspondence, measuring each against the same clean baseline.
    research_question: >-
      Does the multimodal gain come from the correspondence between streams, or merely
      from having more features?
    canonical:
      - scripts/run_multimodal_robustness.py
    adapter: scripts.stages.human_affect:multimodal_robustness
    inputs:
      - outputs/human_affect/experiments/multimodal_robustness.json
    outputs:
      - outputs/human_affect/13_multimodal_robustness/robustness.json
    depends_on: [HUMAN_AFFECT-11]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    execution: VERIFIED
    experiment_id: null
    limitations: [L-08]
    notes: >-
      The misalignment condition is the one that matters. Rows of one block are permuted
      within each actor, so the speaker and the label distribution are unchanged and only
      the correspondence is destroyed. It costs more than heavy noise on either stream,
      which is what establishes that the fusion gain is about pairing rather than about
      feature count. Random and structural degradation only; adversarial robustness needs
      an attacker model and is NOT RUN.

  - id: HUMAN_AFFECT-14
    index: 14
    category: HUMAN_AFFECT
    slug: xai_calibration_representation
    name: Modality attribution, calibration and representation
    purpose: >-
      Attribute performance to modality blocks by intervention, consolidate calibration
      under one definition, and report performance across the groups the corpus documents.
    research_question: >-
      Which modality does the model actually use, how well calibrated is each arm, and
      does performance differ across documented groups?
    canonical:
      - scripts/run_multimodal_xai_fairness.py
    adapter: scripts.stages.human_affect:xai_calibration_representation
    inputs:
      - outputs/human_affect/experiments/xai_fairness.json
    outputs:
      - outputs/human_affect/14_xai_calibration_representation/xai.json
    depends_on: [HUMAN_AFFECT-11]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    execution: VERIFIED
    experiment_id: null
    limitations: [L-08, L-09]
    notes: >-
      Attribution is group permutation importance: each block is shuffled within actor on
      the evaluation fold, so it measures what the model loses rather than what a surrogate
      believes. A vision-language description is never called an explanation; it is a
      model-generated visual rationale, because no faithfulness evaluation of it exists.
      The group analysis is not demographic fairness and does not claim to be: RAVDESS
      publishes actor sex and nothing else about the people, so no other person-level
      attribute is analysed and none is inferred. Every group carries its sample size and a
      Wilson interval, and a gap whose intervals overlap is reported as unestablished.

  - id: HUMAN_AFFECT-15
    index: 15
    category: HUMAN_AFFECT
    slug: vlm_family_comparison
    name: Two vision-language families compared
    purpose: >-
      Compare a free-form describing model against a question-answering model from a
      different architecture family, on grounding, latency, memory and stability.
    research_question: >-
      Does the architecture and interaction mode of a vision-language model change what it
      claims to see, and by how much?
    canonical:
      - scripts/run_vlm_family_comparison.py
    adapter: scripts.stages.human_affect:vlm_family_comparison
    inputs:
      - outputs/vlm/vlm_family_comparison.json
    outputs:
      - outputs/human_affect/15_vlm_family_comparison/family_comparison.json
    depends_on: [HUMAN_AFFECT-09]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    execution: VERIFIED
    experiment_id: null
    limitations: [L-08, L-09]
    notes: >-
      SmolVLM (SigLIP tower into a Llama decoder, free-form) against BLIP-VQA (ViT-B/16
      into a BERT encoder-decoder with a question-answering head). The hallucination
      battery is six stimulus classes of which exactly one contains a human face. Region
      coverage is deliberately not compared across families: a question-answering model is
      asked about each region, so its coverage measures the question list rather than the
      model. Florence-2 remains blocked under transformers 5.15 (KI-08), which is why the
      second family is BLIP rather than a third SmolVLM size.

  - id: HUMAN_AFFECT-16
    index: 16
    category: HUMAN_AFFECT
    slug: financial_domain_transfer
    name: Financial-domain transfer interface
    purpose: >-
      Hold the interface, the requirements and the candidate search for transferring the
      affective models to financial media, so a qualifying corpus can be plugged in.
    research_question: >-
      Do affective models trained on general-domain acted speech transfer to spontaneous
      financial communication?
    canonical:
      - research/human_affect/transfer.py
    adapter: scripts.stages.human_affect:financial_domain_transfer
    inputs: []
    outputs:
      - outputs/human_affect/16_financial_domain_transfer/transfer.json
    depends_on: [HUMAN_AFFECT-04, HUMAN_AFFECT-06]
    wrapper_status: WRAPS_EXISTING
    status: BLOCKED
    execution: BLOCKED
    experiment_id: null
    limitations: [L-09]
    notes: >-
      General-domain affective validation is COMPLETE; financial-domain validation is NOT
      AVAILABLE and financial-domain transfer is a stated LIMITATION. Five candidate
      corpora were considered and each is recorded with its specific disqualification:
      MAEC and MDRM are financial but carry no affect annotation, CMU-MOSEI and IEMOCAP
      are annotated but general-domain, and broadcast financial television is copyrighted
      and unannotated. validate_target_domain() refuses a general-domain corpus offered as
      the financial one, because relabelling would make the transfer result measure
      nothing but corpus identity. The experiment is written against this interface and
      runs unchanged the moment a qualifying corpus exists.

  # ----------------------------------------------------------------- CORPUS ----

  - id: CORPUS-01
    index: 1
    category: CORPUS
    slug: corpus_build
    name: Traceable corpus assembly
    purpose: >-
      Assemble the research corpus from the real sources in this tree with per-row
      provenance, then add copula-generated rows fitted on training data only.
    research_question: >-
      Can a corpus at this scale be assembled so that every row states its origin, its
      licence and whether it was observed or generated?
    canonical:
      - research/corpus/__init__.py
      - research/corpus/build.py
      - scripts/build_corpus.py
    adapter: scripts.stages.corpus:corpus_build
    inputs:
      - data/panel/cash_panel.parquet
      - data/panel/text_corpus.parquet
      - data/panel/multimodal_dataset.parquet
    outputs:
      - outputs/corpus/corpus_report.json
      - outputs/corpus/corpus_shards.csv
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: >-
      Fifteen provenance columns on every row, validated by a dataclass that refuses a
      real sample naming a generator, a generated sample not naming one, or any sample
      with a blank licence. Financial splits are chronological using the modelling panel's
      own boundaries; human-affect splits are speaker-disjoint; annotation rows are split
      by text so one sentence cannot cross a split; synthetic rows are forced to train.
      Rows beyond the validation boundary keep the label holdout and are never relabelled
      test.

  - id: CORPUS-02
    index: 2
    category: CORPUS
    slug: corpus_quality
    name: Duplication, contamination and effective sample size
    purpose: >-
      Measure whether the row count is a sample count: exact and near duplicates,
      cross-split contamination, and the design effect against independent units.
    research_question: >-
      How many independent observations does this corpus actually contain, and does any
      content appear on both sides of a split?
    canonical:
      - research/corpus/quality.py
    adapter: scripts.stages.corpus:corpus_quality
    inputs:
      - outputs/corpus/corpus_report.json
    outputs:
      - outputs/corpus/02_corpus_quality/quality.json
    depends_on: [CORPUS-01]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: >-
      A row count is not a sample count. Rows sharing a recording, an instrument or a text
      are not independent draws, so the design effect is reported beside every total and
      inference is expected to use the unit count. Near-duplicate rate is estimated from a
      bounded random sample of row pairs because all-pairs comparison is quadratic, and
      the sample size is reported rather than the truncation being silent.

  - id: CORPUS-03
    index: 3
    category: CORPUS
    slug: real_vs_synthetic
    name: Does synthetic training data help or harm?
    purpose: >-
      Fit on real rows alone and on real plus generated rows, score both on the same real
      evaluation rows, and sweep the synthetic share of the training set.
    research_question: >-
      Does adding copula-generated rows to training improve or degrade generalization
      measured on real data?
    canonical:
      - research/corpus/synthesis.py
      - scripts/run_real_vs_synthetic.py
    adapter: scripts.stages.corpus:real_vs_synthetic
    inputs:
      - outputs/corpus/corpus_report.json
    outputs:
      - outputs/corpus/real_vs_synthetic.json
      - outputs/corpus/real_vs_synthetic.csv
    depends_on: [CORPUS-01]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: >-
      Both arms are scored on the same real rows and the runner aborts if any synthetic
      row reaches an evaluation split. The generator is checked for memorisation by
      nearest-neighbour distance against the real data, scaled by the real statistics so a
      verbatim copy cannot hide behind separate standardisation. The result is reported
      whichever way it falls.

  - id: CORPUS-04
    index: 4
    category: CORPUS
    slug: research_validation
    name: Consolidated research validation and scorecard
    purpose: >-
      Fill fifteen research dimensions for both tracks from artifacts on disk and gate the
      headline claims against the numbers that decide them.
    research_question: >-
      Which research dimensions are actually evidenced, and which headline claims survive
      contact with the results?
    canonical:
      - research/validation/__init__.py
      - scripts/generate_research_validation.py
    adapter: scripts.stages.corpus:research_validation
    inputs: []
    outputs:
      - outputs/research_validation/validation_summary.json
      - outputs/research_validation/research_validation_report.md
    depends_on: [CORPUS-01, CORPUS-03]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: []
    notes: >-
      A cell cannot read SUPPORTED without an evidence file behind it: the dataclass
      refuses to construct one. Dimensions with no artifact report NOT RUN and name what
      would produce one. The claim gate returns SUPPORTED, QUALIFIED or NOT SUPPORTED per
      claim, and a claim the evidence contradicts is recorded as contradicted rather than
      dropped.

  # ------------------------------------------------------------- MULTIMODAL ----

  - id: MULTIMODAL-01
    index: 1
    category: MULTIMODAL
    slug: text_corpus_ingestion
    name: Text corpus ingestion
    purpose: >-
      Build the financial text corpus aligned to instruments and dates, with each document
      carrying its publication and knowledge timestamps and a source-credibility weight.
    research_question: >-
      What text evidence is available at each decision time, and how is its availability
      distributed across instruments?
    canonical:
      - research/detection/episodes.py::generate_text_corpus
    adapter: scripts.stages.multimodal:text_corpus_ingestion
    inputs:
      - data/panel/episode_labels.parquet
    outputs:
      - data/panel/text_corpus.parquet
    depends_on: []
    wrapper_status: WRAPS_EXISTING_PROTECTED
    status: SUPPORTED
    experiment_id: null
    limitations: [L-04]
    notes: >-
      The corpus is generated alongside the synthetic episodes, not scraped from
      publishers. Regenerating changes every downstream text feature. Requires --force.
    ui:
      icon: ¶
      product_name: The financial text stream
      route: /multimodal/text-corpus
      product_headline: The text stream and where it came from
      product_question: What text is aligned to each instrument-day, and who wrote it?
      product_actions:
      - See how many text items are aligned to the panel
      - Read the provenance of the text stream
      - Check the synthetic-text boundary before reading a text result
      product_observation: Text items are aligned to instrument-days by date, so each row's
        text block summarises only what was available on or before that session.
      product_risk: The episode text corpus is generated by this project rather than collected
        from a newswire (L-04). It is never described as real market commentary.
      confidence: LOW
      visual: provenance
      product_metrics:
      - label: Text rows in the corpus
        value: json:outputs/corpus/corpus_report.json#composition.source_datasets.AEGIS_TEXT_CORPUS
        format: int
        note: aligned to the panel
      - label: Text-block coverage
        value: csv:outputs/stats/01_data_integrity_profile/block_coverage.csv#cell:block=text:mean_non_null_fraction
        format: pct
        note: fraction of rows with a text block
      research_metrics:
      - label: Declared text features
        value: csv:outputs/stats/01_data_integrity_profile/block_coverage.csv#cell:block=text:declared_features
        format: int
      - label: Present in dataset
        value: csv:outputs/stats/01_data_integrity_profile/block_coverage.csv#cell:block=text:present_in_dataset
        format: int
      figures: []
      tables:
      - table11_dataset_provenance
      inputs:
      - kind: date_range
        label: Date range
        note: Filter the aligned text summary. The corpus itself is a protected artifact and
          is not rebuilt here.
    analysis:
      adapter: scripts.stages.multimodal:analyse_text_corpus
      mode: LIVE
      typical_seconds: 4.0
      summary: >-
        Runs the canonical affect extractor over a deterministic sample of the documents
        aligned to your selection. The lexicon match rate is returned beside the scores,
        because a dimension scored from one matched token in eight is not the same object
        as one scored from twenty.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: first publication date included
        - name: date_to
          kind: date
          label: To
          default: '2022-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: last publication date included
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: leave empty for every instrument carrying text in the range
        - name: doc_kind
          kind: select
          label: Document kind
          default: all
          options:
            - all
            - background_neutral
            - background_alarm
            - episode_escalation
            - episode_peak
            - episode_resolution
            - episode_offnarrative
          note: >-
            episode documents are narration generated with the injected episodes (L-04);
            background documents are filler. Neither is collected market commentary.
        - name: sample_size
          kind: int
          label: Documents to score
          default: 400
          minimum: 50
          maximum: 2000
          note: >-
            scored live at roughly a hundred documents a second; the sample is drawn with
            a fixed seed so the same selection returns the same documents

  - id: MULTIMODAL-02
    index: 2
    category: MULTIMODAL
    slug: text_affect_extraction
    name: Text affect extraction
    purpose: >-
      Apply the lexicon-based affect extractor to the corpus and report the distribution of
      each affective dimension it produces.
    research_question: >-
      Which affective dimensions of financial text vary enough to carry information, and
      which are near-constant?
    canonical:
      - research/text/affect.py::extract
      - research/text/affect.py::TEXT_AFFECT_DIMENSIONS
      - research/text/lexicon.py
    adapter: scripts.stages.multimodal:text_affect_extraction
    inputs:
      - data/panel/text_corpus.parquet
    outputs:
      - outputs/multimodal/02_text_affect_extraction/affect_distribution.csv
    depends_on: [MULTIMODAL-01]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: [L-05]
    notes: >-
      Affective dimensions are lexicon proxies. No claim is made about the mental state of
      any real person.
    ui:
      icon: ☺
      product_name: Tone in financial text
      route: /multimodal/text-affect
      product_headline: The affective signal carried by language
      product_question: What affective dimensions does the text carry, and how are they distributed?
      product_actions:
      - See the distribution of each linguistic affective dimension
      - Compare the spread of valence against arousal
      - Read the calibration caveat before treating a value as an emotion
      product_observation: Valence and arousal are both concentrated near zero with a long positive
        tail, so most rows carry little linguistic affective signal and a few carry a great
        deal.
      product_risk: These are uncalibrated lexicon-derived proxies, not measurements of anyone's
        emotion (L-05). The word 'affect' here names a text feature.
      confidence: LOW
      visual: affect_distribution
      product_metrics:
      - label: Dimensions extracted
        value: csv:outputs/multimodal/02_text_affect_extraction/affect_distribution.csv#rows
        format: int
        note: linguistic affective dimensions
      - label: Mean valence
        value: csv:outputs/multimodal/02_text_affect_extraction/affect_distribution.csv#cell:dimension=valence:mean
        format: float4
        note: model-estimated, uncalibrated
      - label: Mean arousal
        value: csv:outputs/multimodal/02_text_affect_extraction/affect_distribution.csv#cell:dimension=arousal:mean
        format: float4
        note: model-estimated, uncalibrated
      research_metrics:
      - label: Valence standard deviation
        value: csv:outputs/multimodal/02_text_affect_extraction/affect_distribution.csv#cell:dimension=valence:std
        format: float4
      - label: Arousal standard deviation
        value: csv:outputs/multimodal/02_text_affect_extraction/affect_distribution.csv#cell:dimension=arousal:std
        format: float4
      - label: Items scored
        value: csv:outputs/multimodal/02_text_affect_extraction/affect_distribution.csv#cell:dimension=valence:count
        format: int
      figures:
      - figHA05_text_confusion
      - figHA08_text_token_attribution
      tables: []
    analysis:
      adapter: scripts.stages.multimodal:analyse_text_affect
      mode: LIVE
      typical_seconds: 2.0
      summary: >-
        Runs the canonical extractor over your slice and shows how one dimension varies
        across groups. A dimension named for an emotion is a lexicon match count under
        that name, over text this project generated.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first publication date
        - name: date_to
          kind: date
          label: To
          default: '2022-12-31'
