        value: csv:outputs/multimodal/14_modality_information/decomposition.csv#rows
        format: int
        note: with both a stand-alone and a leave-one-out arm
      - label: Largest unique contribution
        value: csv:outputs/multimodal/14_modality_information/decomposition.csv#agg:unique:max
        format: float4
        note: AUPRC lost if that block is removed
      - label: Smallest unique contribution
        value: csv:outputs/multimodal/14_modality_information/decomposition.csv#agg:unique:min
        format: float4
        note: the most redundant block
      research_metrics:
      - label: Highest conflict rate
        value: csv:outputs/multimodal/14_modality_information/decomposition.csv#agg:conflict_rate:max
        format: pct
      - label: Full-stack AUPRC
        value: csv:outputs/multimodal/14_modality_information/decomposition.csv#agg:auprc_full:max
        format: float4
      figures:
      - figINFO_modality_matrix
      - figR15_modality_attribution
      tables:
      - table05_ablation
    analysis:
      adapter: scripts.stages.multimodal:analyse_decomposition
      mode: LIVE
      typical_seconds: 3.0
      summary: >-
        Unique, shared and synergistic contribution per modality, recomputed from the
        stored per-arm scores. A modality needs both a stand-alone and a leave-one-out
        arm to be decomposed; one without both is reported as unavailable rather than
        guessed.
      inputs:
        - name: modalities
          kind: multiselect
          label: Modalities
          default: [text, image, audio, video, market, microstructure]
          max_items: 8
          options:
            - text
            - image
            - audio
            - video
            - market
            - microstructure
            - regime
            - propagation
          note: >-
            which modalities to decompose
        - name: date_from
          kind: date
          label: From
          default: '2019-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first scored session
        - name: date_to
          kind: date
          label: To
          default: '2026-08-14'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last scored session

  - id: MULTIMODAL-15
    index: 15
    category: MULTIMODAL
    slug: modality_missingness_asynchrony
    name: Modality missingness
    purpose: >-
      Measure performance and calibration degradation as modalities are withheld, singly
      and in combination.
    research_question: >-
      How gracefully does the system degrade when a modality is unavailable, and does its
      uncertainty respond correctly?
    canonical:
      - research/evaluation/ablations.py::apply_arm
      - research/evaluation/experiment.py::run
    adapter: scripts.stages.multimodal:modality_missingness
    inputs:
      - research_artifacts/experiments
    outputs:
      - outputs/multimodal/15_modality_missingness_asynchrony/missingness.csv
    depends_on: [MULTIMODAL-14]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: EXP-ABL-1
    limitations: []
    notes: >-
      A withheld modality has its coverage flag zeroed as well as its columns cleared, so a
      stale flag cannot let it vote.
    ui:
      icon: ⊘
      product_name: When evidence goes missing
      route: /multimodal/missingness
      product_headline: What happens when a modality goes away
      product_question: How gracefully does the system degrade when a source becomes unavailable?
      product_actions:
      - Compare each leave-one-out arm against the full stack
      - See which modality is most costly to lose
      - Check that a withheld modality is withheld rather than imputed
      product_observation: Withholding a redundant channel costs almost nothing; withholding
        the text or market block costs a great deal. A withheld modality has its coverage flag
        zeroed as well as its columns cleared.
      product_risk: Measured on injected episodes in the validation split (L-04). The human
        audiovisual version of this experiment is the stronger evidence, and it is reported
        separately (CLAIM-17).
      confidence: MODERATE
      visual: ablation_bars
      product_metrics:
      - label: Leave-one-out arms
        value: csv:outputs/multimodal/15_modality_missingness_asynchrony/missingness.csv#rows
        format: int
        note: one per withheld modality
      - label: Best arm without one modality
        value: csv:outputs/multimodal/15_modality_missingness_asynchrony/missingness.csv#agg:auprc:max
        format: float4
        note: least costly modality to lose
      - label: Worst arm without one modality
        value: csv:outputs/multimodal/15_modality_missingness_asynchrony/missingness.csv#agg:auprc:min
        format: float4
        note: most costly modality to lose
      research_metrics:
      - label: Missing-audio cost on human media
        value: json:outputs/human_affect/13_multimodal_robustness/robustness.json#conditions[condition=missing_audio].degradation
        format: float4
      - label: Missing-face cost on human media
        value: json:outputs/human_affect/13_multimodal_robustness/robustness.json#conditions[condition=missing_face].degradation
        format: float4
      - label: Adversarial robustness
        value: json:outputs/human_affect/13_multimodal_robustness/robustness.json#adversarial
        format: text
      figures:
      - fig09_modality_ablation
      - figC02_alignment_degradation
      tables:
      - table05_ablation
      - table08_robustness
      inputs:
      - kind: modality
        label: Withheld modality
        note: Choose which leave-one-out arm to foreground. Every arm is pre-computed.
    analysis:
      adapter: scripts.stages.multimodal:analyse_missingness
      mode: LIVE
      typical_seconds: 55.0
      summary: >-
        Takes one modality offline for part of the evaluation rows — columns and
        coverage flag together — and refits nothing. Clearing the flag matters: a
        modality whose columns are blank but whose flag still reads present keeps voting
        with nothing behind it.
      inputs:
        - name: modality
          kind: select
          label: Modality to take offline
          default: text
          options:
            - text
            - image
            - audio
            - video
            - market
            - microstructure
            - regime
            - propagation
          note: >-
            whose block is blanked
        - name: fraction
          kind: float
          label: Rows affected
          default: 0.5
          minimum: 0.05
          maximum: 1.0
          note: >-
            the share of evaluation rows that lose the modality
        - name: seed
          kind: int
          label: Seed
          default: 20260818
          minimum: 1
          maximum: 99999999
          note: >-
            which rows lose it is a random draw

  - id: MULTIMODAL-16
    index: 16
    category: MULTIMODAL
    slug: multimodal_xai
    name: Multimodal explanation and XAI benchmark
    purpose: >-
      Run the attribution methods and the XAI benchmark: faithfulness by deletion and
      insertion, stability, cross-method agreement, cost, and the sanity suite.
    research_question: >-
      Do the explanation methods agree, are they faithful to the model, and do they pass
      the sanity checks that would expose an explanation independent of the model?
    canonical:
      - research/xai/methods.py
      - research/xai/benchmark.py
      - research/xai/sanity.py
      - scripts/generate_paper_artifacts.py
    adapter: scripts.stages.multimodal:multimodal_xai
    inputs:
      - data/panel/multimodal_dataset.parquet
    outputs:
      - research_artifacts/statistics
      - research_artifacts/figures
    depends_on: [MULTIMODAL-14]
    wrapper_status: WRAPS_EXISTING_PROTECTED
    status: PARTIAL
    experiment_id: EXP-N01-1
    limitations: [L-08]
    notes: >-
      The sanity suite currently reports a failure and that failure is retained rather than
      tuned away (N-01). Regenerating overwrites cited artifacts. Requires --force.
    ui:
      icon: ◉
      product_name: Why the model said that
      route: /multimodal/xai
      product_headline: Why the system produced the number it did
      product_question: Which parts of the evidence moved the answer, and how far can that attribution
        be trusted?
      product_actions:
      - See modality contribution measured by intervention on the model's inputs
      - Compare attribution methods against each other
      - Read the distinction between a generated rationale and a validated explanation
      product_observation: Attribution measured by shuffling a modality block as a unit assigns
        the signal to the acoustic and facial blocks on human media, and to text and market
        on the market track.
      product_risk: The stability check fails its pre-declared threshold (N-01), and attributions
        are computed on a surrogate whose performance differs slightly from the deployed model
        (L-08). A vision-language description is a generated rationale, never a validated explanation.
      confidence: LOW
      visual: attribution
      product_metrics:
      - label: Acoustic block importance
        value: json:outputs/human_affect/14_xai_calibration_representation/xai.json#attribution.blocks[block=AUDIO].importance_mean
        format: float4
        note: balanced accuracy lost when the block is shuffled
      - label: Facial block importance
        value: json:outputs/human_affect/14_xai_calibration_representation/xai.json#attribution.blocks[block=FACE].importance_mean
        format: float4
        note: balanced accuracy lost when the block is shuffled
      - label: Vision-language block importance
        value: json:outputs/human_affect/14_xai_calibration_representation/xai.json#attribution.blocks[block=VLM].importance_mean
        format: float4
        note: within its own standard deviation of zero
      research_metrics:
      - label: Text block importance
        value: json:outputs/human_affect/14_xai_calibration_representation/xai.json#attribution.blocks[block=TEXT].importance_mean
        format: float4
      - label: Method
        value: json:outputs/human_affect/14_xai_calibration_representation/xai.json#attribution.method
        format: text
      - label: Faithfulness definition
        value: json:outputs/human_affect/14_xai_calibration_representation/xai.json#attribution.faithfulness
        format: text
      - label: Vision-language rationale status
        value: json:outputs/human_affect/14_xai_calibration_representation/xai.json#vlm_rationale_status
        format: text
      figures:
      - figR15_modality_attribution
      - fig22_global_importance
      - figN01_lime_stability
      tables:
      - table10_xai_agreement
      - table17_xai_sanity
      - table18_explanation_faithfulness
      inputs:
      - kind: row
        label: Row
        note: Pick a scored row to see its local attribution. The attributions are exported
          artifacts; no model runs in the request path.

