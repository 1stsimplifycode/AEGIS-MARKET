  - id: SCENARIO-03
    index: 3
    category: SCENARIO
    slug: counterfactual_conditions
    name: Counterfactual conditions
    purpose: Report what the model would have estimated had a channel shifted, gone offline,
      or arrived a session late, using the same perturbation primitives the robustness track
      uses and re-scoring with the same fitted model.
    research_question: How sensitive is the risk estimate to changes in the conditions it is
      given, and which channel does it actually depend on?
    canonical:
    - research/scenario/engine.py::materialise
    - research/evaluation/robustness.py::perturb
    - research/evaluation/robustness.py::blackout_modality
    adapter: scripts.stages.scenario:counterfactual_conditions
    inputs:
    - outputs/scenario/scenario_results.json
    outputs:
    - outputs/scenario/scenario_comparison.csv
    depends_on:
    - SCENARIO-01
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations:
    - L-04
    - L-09
    - L-24
    notes: None of these conditions occurred. Each result holds only under the assumption recorded
      on its scenario, and the module reports the assumption count beside every effect.
    ui:
      icon: ◈
      product_name: What if the evidence differed
      route: /scenario/counterfactuals
      product_headline: What the model would have reported under a different world
      product_question: How far does the risk estimate move when a channel shifts, disappears
        or arrives late?
      product_actions:
      - Compare each altered condition against the untouched baseline
      - See which channel the estimate actually depends on
      - Read the assumption each counterfactual rests on
      product_observation: Shifting the narrative channel two standard deviations moves the
        estimate by -0.0464; taking that channel offline entirely moves it by -0.0064; and delaying
        half the market features by one session moves it by -0.0004, an interval that spans
        zero. The model leans on what the text says far more than on whether the text is there.
      product_risk: None of these conditions occurred (L-24). Each result is what the model
        would have estimated under the assumption recorded beside it, and it is not a statement
        about what would have happened.
      confidence: MODERATE
      visual: scenario_bars
      product_metrics:
      - label: Sentiment shock
        value: csv:outputs/scenario/scenario_comparison.csv#cell:scenario_id=SC-MKT-SENT:delta_risk_mean
        format: float4
        note: change in mean risk under a two-sigma negative shift
      - label: Text channel offline
        value: csv:outputs/scenario/scenario_comparison.csv#cell:scenario_id=SC-MKT-NOTEXT:delta_risk_mean
        format: float4
        note: change when the channel and its coverage flag are cleared
      - label: Market channel offline
        value: csv:outputs/scenario/scenario_comparison.csv#cell:scenario_id=SC-MKT-NOMKT:delta_risk_mean
        format: float4
        note: change when the primary channel is cleared
      - label: Delayed processing
        value: csv:outputs/scenario/scenario_comparison.csv#cell:scenario_id=SC-MKT-DELAY:delta_risk_mean
        format: float4
        note: change when half the rows carry stale market features
      research_metrics:
      - label: Sentiment shock CI low
        value: csv:outputs/scenario/scenario_uncertainty.csv#cell:scenario_id=SC-MKT-SENT:ci_low
        format: float5
      - label: Sentiment shock CI high
        value: csv:outputs/scenario/scenario_uncertainty.csv#cell:scenario_id=SC-MKT-SENT:ci_high
        format: float5
      - label: 'Market offline: uncertainty change'
        value: csv:outputs/scenario/scenario_comparison.csv#cell:scenario_id=SC-MKT-NOMKT:delta_uncertainty_mean
        format: float4
      - label: Delay CI low
        value: csv:outputs/scenario/scenario_uncertainty.csv#cell:scenario_id=SC-MKT-DELAY:ci_low
        format: float5
      - label: Delay CI high
        value: csv:outputs/scenario/scenario_uncertainty.csv#cell:scenario_id=SC-MKT-DELAY:ci_high
        format: float5
      figures:
      - figS02_counterfactual_outcome
      tables:
      - table14_scenario_comparison
      inputs:
      - kind: scenario
        label: Counterfactual
        note: Choose which altered condition to foreground. Nothing is re-scored in the browser.

  - id: SCENARIO-04
    index: 4
    category: SCENARIO
    slug: mitigation_policies
    name: Mitigation policy comparison
    purpose: Compare declared exposure policies on identical scored sessions and report the
      simulated difference in the daily tail loss, expressed on a declared notional research
      base with a moving-block interval.
    research_question: If a different exposure rule had been applied to the same evidence, how
      would the simulated tail have differed, and by more than its interval?
    canonical:
    - research/risk/gate.py::capital_consequence
    - research/scenario/money.py::CurrencyEstimate
