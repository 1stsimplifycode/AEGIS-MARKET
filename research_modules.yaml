        note: largest subset, the full stack
      - label: Cells where the block was present
        value: csv:outputs/scenario/scenario_ablation.csv#count:informative_cell=True
        format: int
        note: cells where the scenario could still have an effect
      - label: Direction preserved
        value: csv:outputs/scenario/scenario_ablation.csv#count:direction_survives=True
        format: int
        note: cells pointing the same way as the full stack, or zero by construction
      research_metrics:
      - label: Smallest subset
        value: csv:outputs/scenario/scenario_ablation.csv#agg:n_modalities:min
        format: int
      - label: Largest effect under ablation
        value: csv:outputs/scenario/scenario_ablation.csv#agg:delta_risk_mean:max
        format: float4
      - label: Smallest effect under ablation
        value: csv:outputs/scenario/scenario_ablation.csv#agg:delta_risk_mean:min
        format: float4
      figures:
