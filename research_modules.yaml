            which split to describe

  - id: MULTIMODAL-10
    index: 10
    category: MULTIMODAL
    slug: media_licensing_provenance
    name: Media licensing and provenance
    purpose: >-
      Verify that every media asset and dataset carries a licence record, and that nothing
      with UNKNOWN status has reached a publication artifact.
    research_question: >-
      Is every piece of evidence in this repository traceable to a source whose terms
      permit the use being made of it?
    canonical:
      - research/core/licensing.py::MediaLicenseChecker
      - research/core/licensing.py::LicenceRegistry
    adapter: scripts.stages.multimodal:media_licensing_provenance
    inputs:
      - data/media/references
    outputs:
      - outputs/multimodal/10_media_licensing_provenance/licence_report.json
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: >-
      Public accessibility is never treated as permission to redistribute. Reference
      metadata is stored instead of media wherever redistribution is not permitted.
    ui:
      icon: ⚖
      product_name: Media rights and provenance
      route: /multimodal/provenance
      product_headline: Where every asset came from and what may be done with it
      product_question: Is every piece of media in this system licensed for the use it is put
        to?
      product_actions:
      - Read the licence status vocabulary the checker enforces
      - See which assets are reference-only rather than stored
      - Check that nothing with UNKNOWN status reaches a publication artifact
      product_observation: Every media asset carries a declared licence status. Where redistribution
        is not permitted, reference metadata is stored instead of the media itself.
      product_risk: Public accessibility is not permission to redistribute. The checker enforces
        that distinction; it cannot verify a licence text it was not given.
      confidence: HIGH
      visual: provenance
      product_metrics:
      - label: Reference-only assets
        value: json:outputs/multimodal/10_media_licensing_provenance/licence_report.json#reference_files
        format: count
        note: stored as metadata, not media
      - label: Licence statuses declared
        value: json:outputs/multimodal/10_media_licensing_provenance/licence_report.json#statuses_declared
        format: count
        note: the vocabulary the checker enforces
      - label: Checker available
        value: json:outputs/multimodal/10_media_licensing_provenance/licence_report.json#checker_available
        format: bool
        note: the gate is active
      research_metrics:
      - label: Policy
        value: json:outputs/multimodal/10_media_licensing_provenance/licence_report.json#policy
        format: text
      figures: []
      tables:
      - table11_dataset_provenance
    analysis:
      adapter: scripts.stages.multimodal:analyse_media_licence
      mode: LIVE
      typical_seconds: 0.5
      summary: >-
        Classifies a media reference against the licence rules, offline. The URL is
        never fetched: the question is whether the material may be redistributed, and
        its host cannot answer that.
      inputs:
        - name: source_url
          kind: text
          label: Media reference
          default: 'https://www.reuters.com/markets/'
          required: true
          note: >-
            the full address of the reference you want classified
        - name: publisher
          kind: text
          label: Publisher
          default: ''
          note: >-
            optional; recorded with the verdict
        - name: licence_name
          kind: text
          label: Declared licence
          default: ''
          note: >-
            optional; a declaration alone never upgrades a status without evidence

  - id: MULTIMODAL-11
    index: 11
    category: MULTIMODAL
    slug: crossmodal_alignment
    name: Cross-modal temporal alignment
    purpose: >-
      Measure sensitivity to temporal misalignment between modalities by shifting one
      modality against the others and re-scoring.
    research_question: >-
      How much does multimodal performance depend on the modalities being aligned to the
      same timestamp?
    canonical:
      - research/evaluation/temporal_analysis.py::asynchrony_sensitivity
    adapter: scripts.stages.multimodal:crossmodal_alignment
    inputs:
      - data/panel/multimodal_dataset.parquet
    outputs:
      - outputs/multimodal/11_crossmodal_alignment/asynchrony.csv
    depends_on: [MULTIMODAL-12]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: []
    notes: >-
      Fits a model per offset, so this is the slowest read-only module in the pipeline.
    ui:
      icon: ⇄
      product_name: When evidence arrives late
      route: /multimodal/alignment
      product_headline: What happens when the modalities stop lining up
      product_question: How much of the result depends on the modalities describing the same
        moment?
      product_actions:
      - Shift one modality against the others and watch performance move
      - Compare the cost of misalignment against the cost of noise
      - Read the alignment result before trusting any fusion number
      product_observation: Performance falls as a modality is shifted away from the others.
        On human audiovisual media the same experiment shows destroying the audio-video pairing
        costs an order of magnitude more than heavy noise on either stream.
      product_risk: Offsets here are whole sessions on market-derived channels, which are already
        near-duplicates of each other. The strong version of this finding comes from the human
        audiovisual corpus (CLAIM-17).
      confidence: MODERATE
      visual: alignment_curve
      product_metrics:
      - label: Offsets tested
        value: csv:outputs/multimodal/11_crossmodal_alignment/asynchrony.csv#rows
        format: int
        note: modality by offset
      - label: Aligned AUPRC
        value: csv:outputs/multimodal/11_crossmodal_alignment/asynchrony.csv#agg:auprc:max
        format: float4
        note: best condition, at zero offset
      - label: Worst misaligned AUPRC
        value: csv:outputs/multimodal/11_crossmodal_alignment/asynchrony.csv#agg:auprc:min
        format: float4
        note: largest offset tested
      research_metrics:
      - label: Misaligned-audio cost on human media
        value: json:outputs/human_affect/13_multimodal_robustness/robustness.json#conditions[condition=misaligned_audio].degradation
        format: float4
      - label: Heavy-audio-noise cost on human media
        value: json:outputs/human_affect/13_multimodal_robustness/robustness.json#conditions[condition=noise_audio].degradation
        format: float4
      figures:
      - figC02_alignment_degradation
      - figR14_multimodal_robustness
      tables:
      - table08_robustness
      inputs:
      - kind: modality
        label: Modality to shift
        note: Choose which channel to offset. All offsets are pre-computed; nothing is re-scored
          in the browser.
    analysis:
      adapter: scripts.stages.multimodal:analyse_alignment
      mode: LIVE
      typical_seconds: 42.0
      summary: >-
        Fits the model now, then scores it with one modality shifted forward in time.
        Forward is the only realistic direction: media arrives later than market data,
        never earlier.
      inputs:
        - name: modality
          kind: select
          label: Modality to delay
          default: text
          options:
            - text
            - image
            - audio
            - video
            - market
            - microstructure
            - regime
            - propagation
          note: >-
            whose feature block is shifted
        - name: max_offset
          kind: int
          label: Largest delay
          default: 10
          minimum: 1
          maximum: 20
          note: >-
            in sessions; every smaller offset in the standard set is measured too
        - name: seed
          kind: int
          label: Seed
          default: 20260818
          minimum: 1
          maximum: 99999999
          note: >-
            the fit is seeded, so the same seed reproduces the curve

  - id: MULTIMODAL-12
    index: 12
    category: MULTIMODAL
    slug: multimodal_dataset_assembly
    name: Multimodal dataset assembly
    purpose: >-
      Assemble all eight feature blocks into the 99-feature point-in-time dataset with its
      bitemporal timestamps and split assignment.
    research_question: >-
      Can every feature be constructed using only information available at its own
      knowledge time?
    canonical:
      - research/data/dataset.py
      - scripts/build_dataset.py
    adapter: scripts.stages.multimodal:multimodal_dataset_assembly
    inputs:
      - data/panel/cash_panel.parquet
      - data/panel/text_corpus.parquet
      - data/media
    outputs:
      - data/panel/multimodal_dataset.parquet
    depends_on: [MULTIMODAL-01, MULTIMODAL-04, MULTIMODAL-06, MULTIMODAL-08]
    wrapper_status: WRAPS_EXISTING_PROTECTED
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: >-
      Regenerating changes the dataset every reported number depends on. Requires --force.
    ui:
      icon: ▦
      product_name: How the evidence is joined
      route: /multimodal/dataset
      product_headline: The assembled multimodal dataset
      product_question: How do the modality blocks combine into one row, and how complete is
        each row?
      product_actions:
      - See every modality block and its coverage on the same rows
      - Check the split sizes the blocks are assembled into
      - Read the coverage flags that decide which modalities may vote
      product_observation: Every declared block is present. Coverage differs by block, and a
        block whose coverage flag is zero is withheld from the fusion rather than imputed.
      product_risk: A missing modality is never imputed so that it can vote. That rule is what
        makes the ablation arms interpretable, and it is tested rather than promised.
      confidence: HIGH
      visual: coverage_bars
      product_metrics:
      - label: Rows assembled
        value: json:outputs/stats/01_data_integrity_profile/profile.json#rows
        format: int
        note: instrument-days
      - label: Blocks
        value: csv:outputs/stats/01_data_integrity_profile/block_coverage.csv#rows
        format: int
        note: modality blocks assembled
      - label: Columns
        value: json:outputs/stats/01_data_integrity_profile/profile.json#columns
        format: int
        note: features plus metadata
      - label: Lowest block coverage
        value: csv:outputs/stats/01_data_integrity_profile/block_coverage.csv#agg:mean_non_null_fraction:min
        format: pct
        note: the thinnest block
      research_metrics:
      - label: Train rows
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.train
        format: int
      - label: Validation rows
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.validation
        format: int
      - label: Holdout rows (frozen)
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.holdout
        format: int
      - label: Duplicate keys
        value: json:outputs/stats/01_data_integrity_profile/profile.json#duplicate_keys
        format: int
      figures:
      - figR01_corpus_composition
      - figR11_sample_size_ladder
      tables:
      - table01_dataset_composition
    analysis:
      adapter: scripts.stages.multimodal:analyse_assembly
      mode: LIVE
      typical_seconds: 1.5
      summary: >-
        How completely the modality blocks joined on the rows you select. The figure
        that matters is how many rows carry every block at once, because a result
        computed on rows with three blocks is a different claim from one computed on
        rows with seven.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first session described
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last session described
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range
        - name: split
          kind: select
          label: Split
          default: all
          options:
            - all
            - train
            - validation
            - holdout
          note: >-
            which split to describe

  - id: MULTIMODAL-13
    index: 13
    category: MULTIMODAL
    slug: fusion_strategies
    name: Fusion strategies and the degeneracy proof
    purpose: >-
      Enumerate the six fusion strategies and reproduce the algebraic demonstration that
      the inherited regime-conditioned formulation is identical to static attention.
    research_question: >-
      Does regime conditioning as originally formulated change the fused weights at all?
    canonical:
      - research/multimodal/fusion.py::demonstrate_degeneracy
      - research/multimodal/fusion.py
    adapter: scripts.stages.multimodal:fusion_strategies
    inputs: []
    outputs:
      - outputs/multimodal/13_fusion_strategies/degeneracy.json
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: EXP-N02-1
    limitations: []
    notes: >-
      Purely analytic: the result follows from the algebra and needs no data, which is why
      this module runs without inputs.
    ui:
      icon: ⧉
      product_name: How evidence is combined
      route: /multimodal/fusion
      product_headline: How the modality signals are combined
      product_question: Does the choice of fusion rule change the answer, and by more than the
        random seed?
      product_actions:
      - Compare every fusion rule on the same rows and seeds
      - Read the seed noise floor before reading the ranking
      - See the algebraic result that collapses two of the arms into one
      product_observation: Four fusion rules land within 0.0073 balanced accuracy of one another
        against a seed noise floor of 0.0229, so the ranking between them is not established.
        They do separate on calibration, which is a different axis.
      product_risk: The highest point estimate is not evidence of a better rule (N-08). Separately,
        an inherited regime-conditioned formulation is proved algebraically identical to static
        attention (CLAIM-02).
      confidence: UNRESOLVED
      visual: fusion_compare
      product_metrics:
      - label: Best balanced accuracy
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#summary[strategy=weighted].balanced_accuracy_mean
        format: float4
        note: highest point estimate, not an established winner
      - label: Spread between rules
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#spread_between_real_strategies
        format: float4
        note: distance between best and worst
      - label: Seed noise floor
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#seed_noise_floor.noise_floor_95
        format: float4
        note: what re-seeding alone produces
      - label: Ranking established
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#spread_exceeds_noise_floor
        format: bool
        note: false means the data does not separate the rules
      research_metrics:
      - label: Best-calibrated rule ECE
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#summary[strategy=early].ece_mean
        format: float4
      - label: Worst-calibrated rule ECE
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#summary[strategy=uncertainty].ece_mean
        format: float4
      - label: Clips
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#n_clips
        format: int
      - label: Actors
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#n_actors
        format: int
      - label: Regime-term degeneracy
        value: json:outputs/multimodal/13_fusion_strategies/degeneracy.json#degeneracy.max_abs_weight_difference
        format: sci
      - label: Protocol
        value: json:outputs/human_affect/12_fusion_strategies/fusion_strategies.json#protocol
        format: text
      figures:
      - figR13_fusion_strategies
      - fig12_fusion_ablation
      - fig12b_regime_degeneracy
      tables:
      - table12_fusion_comparison
      - table03_multimodal_results
      inputs:
      - kind: strategy
        label: Fusion rule
        note: Choose which rule to foreground. All rules are pre-computed on identical rows,
          folds and seeds.
    analysis:
      adapter: scripts.stages.multimodal:analyse_degeneracy
      mode: LIVE
      typical_seconds: 1.0
      summary: >-
        Runs the degeneracy proof at parameters you choose. The claim is algebraic, so
        it should survive any parameterisation: turn the regime term up and the
        difference stays at machine precision.
      inputs:
        - name: n_rows
          kind: int
          label: Rows
          default: 500
          minimum: 50
          maximum: 5000
          note: >-
            how many rows to construct
        - name: n_modalities
          kind: int
          label: Modalities
          default: 8
          minimum: 2
          maximum: 32
          note: >-
            how many modality logits enter the softmax
        - name: n_regimes
          kind: int
          label: Regimes
          default: 4
          minimum: 2
          maximum: 16
          note: >-
            how many regimes to draw from
        - name: regime_term_sd
          kind: float
          label: Regime term spread
          default: 25.0
          minimum: 0.1
          maximum: 100.0
          note: >-
            how large to make the term that is supposed to matter
        - name: seed
          kind: int
          label: Seed
          default: 20260818
          minimum: 1
          maximum: 99999999
          note: >-
            the construction is seeded

  - id: MULTIMODAL-14
    index: 14
    category: MULTIMODAL
    slug: modality_information
    name: Modality information decomposition
    purpose: >-
      Decompose each modality's contribution into unique and redundant information, with
      its conflict and missingness rates, from the existing ablation arms.
    research_question: >-
      Does each modality contribute unique information, or is it redundant with, or in
      conflict with, the others?
    canonical:
