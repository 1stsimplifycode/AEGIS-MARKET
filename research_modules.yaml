    - SCENARIO-03
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations:
    - L-09
    - L-12
    notes: One model seed per subset. The question is whether the direction and rough size of
      an effect persist; the seed spread that would bound each cell is SCENARIO-07's job.
    ui:
      icon: ◫
      product_name: Which conditions matter
      route: /scenario/ablation
      product_headline: Whether a scenario conclusion survives losing a channel
      product_question: If a modality had been unavailable, would the same conditions still
        have produced the same conclusions?
      product_actions:
      - Compare each scenario's effect across five modality subsets
      - See where the direction of an effect flips
      - Check which conclusions rest on a single channel
      product_observation: 'Across 40 subset-by-scenario cells the direction of the effect survives
        in 38. The two exceptions are the same scenario: taking the market channel offline raises
        the estimate on the full stack and lowers it once the text channel has already gone,
        so that conclusion depends on which other channel is present.'
      product_risk: One model seed per subset. The seed spread that would bound each cell is
        reported by the robustness module rather than repeated inside every subset.
      confidence: MODERATE
      visual: scenario_ablation
      product_metrics:
      - label: Subset-by-scenario cells
        value: csv:outputs/scenario/scenario_ablation.csv#rows
        format: int
        note: modality subsets times conditions
      - label: Modality subsets
        value: csv:outputs/scenario/scenario_ablation.csv#agg:n_modalities:max
