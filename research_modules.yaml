# AEGIS-Market research module manifest
#
# The single source of truth for the 16 STATS + 16 MULTIMODAL execution modules.
# `STATS/`, `MULTIMODAL/`, every `run.bat` and every module `README.md` are GENERATED
# from this file by `python scripts/validate_structure.py --write`, and checked against it
# by `python scripts/validate_structure.py`. Editing a generated file by hand will be
# reported as drift on the next validation run: change this manifest instead.
#
# IMPORTANT — this manifest describes EXECUTION INTERFACES, not implementations.
# `canonical:` names code that already exists and is not moved, copied or rewritten.
# `adapter:` names a thin dispatcher function in `scripts/stages/` whose only job is to
# import the canonical code and call it. No science lives in the adapter layer.
#
# wrapper_status vocabulary
#   WRAPS_EXISTING            adapter calls existing canonical code; safe to run
#   WRAPS_EXISTING_PROTECTED  same, but regenerating would overwrite artifacts the claim
#                             ledger and documentation already cite; requires --force
#   INFRASTRUCTURE_ONLY       canonical implementation does not exist yet; the module,
#                             its runner and its contract exist so the scientific work can
#                             land in a separate commit. Executing it reports
#                             NOT YET EXECUTED and writes nothing.
#
# status vocabulary is the project's own (docs/LIMITATIONS.md §94):
#   SUPPORTED PARTIAL "NOT SUPPORTED" "NOT RUN" "NOT MEASURED" BLOCKED
#   "OPEN QUESTION" "FUTURE VALIDATION" "FAILED SANITY CHECK"

version: research-modules-v1
generated_by: scripts/validate_structure.py
dispatcher: scripts/run_module.py

exit_codes:
  0: OK
  1: FAILED
  3: BLOCKED
  4: INPUTS MISSING
  5: SKIPPED (protected artifacts; pass --force to regenerate)
  6: NOT YET EXECUTED (infrastructure only)

categories:
  STATS:
    directory: STATS
    master: STATS/run_all_stats.bat
    log_directory: logs/stats
    output_directory: outputs/stats
    description: >-
      Statistical characterisation, validation and evaluation of the risk model and the
      data it is built from.
  MULTIMODAL:
    directory: MULTIMODAL
    master: MULTIMODAL/run_all_multimodal.bat
    log_directory: logs/multimodal
    output_directory: outputs/multimodal
    description: >-
      The modality pipeline: ingestion, feature extraction, alignment, fusion, information
      decomposition and multimodal explanation.
  PRODUCT:
    directory: PRODUCT
    master: PRODUCT/run_all_product.bat
    log_directory: logs/product
    output_directory: outputs/product
    expected_modules: 8
    description: >-
      Local deployment of the Next.js product: install, check, export, build, verify and
      serve. Never touches the research pipeline; consumes only what the exporter wrote.

  HUMAN_AFFECT:
    directory: HUMAN_AFFECT
    master: HUMAN_AFFECT/run_all_human_affect.bat
    log_directory: logs/human_affect
    output_directory: outputs/human_affect
    expected_modules: 16
    description: >-
      Stream B: human-media affective computing over real human speech, video and
      transcripts. Additive and strictly separated from the market-derived Stream A
      pipeline, which is unchanged. Executed on RAVDESS (CC BY-NC-SA 4.0) and
      GoEmotions (Apache-2.0) with speaker-disjoint splits throughout. Includes the
      vision-language branch, which is a second independent way of looking at the same
      frames the landmark pipeline measures -- never a replacement for it.
    expected_modules_note: >-
      10 modules: 8 affective plus 2 vision-language.

  CORPUS:
    directory: CORPUS
    master: CORPUS/run_all_corpus.bat
    log_directory: logs/corpus
    output_directory: outputs/corpus
    expected_modules: 6
    description: >-
      The traceable research corpus and everything that decides whether a number computed
      on it means anything: per-row provenance, duplication and cross-split contamination,
      effective sample size against the row count, and whether synthetic augmentation
      helps or harms real-data generalization.

  SCENARIO:
    directory: SCENARIO
    master: SCENARIO/run_all_scenario.bat
    log_directory: logs/scenario
    output_directory: outputs/scenario
    expected_modules: 8
    description: >-
      The Scenario Lab: counterfactual and observed-condition analysis over the models
      the other categories already fitted. It adds no model, no dataset and no metric.
      Every scenario states its baseline, its assumption, the features it touches and
      the method by which its rows were obtained, and the three methods mean different
      things -- an observed stratum selects rows that occurred, a counterfactual alters
      rows under a stated assumption, and a policy comparison changes a declared decision
      rule on identical evidence. Nothing here executes anything: no order, no payment,
      no approval, no contact. It analyses, simulates and compares.

# The sixteen-week programme. Each week pairs one STATS module with the MULTIMODAL module
# of the same index, because the pair is the unit of work: the statistical treatment and
# the modality it is applied to were designed together and are read together.
#
# This block is the registry the backend serves and the frontend routes from. It declares
# only what cannot be derived. Backend routes, input schemas, output schemas, product and
# research views and artifact sources are all computed from the two named modules by
# `backend/registry.py`, so a week can never advertise a route, a field or an artifact
# that its modules do not actually have.

# ---------------------------------------------------------------------------------------
# What the product offers a reader, and when each part of it joins the demonstration.
#
# The weekly table above is the programme's construction order. This is the same work
# named the way someone using the product would name it, because "Week 8" is a fact about
# how this was built and "Event detection" is a fact about what it does.
#
# `enabled_from_week` is the week whose modules first deliver the capability, so the two
# tables cannot drift: a capability is available exactly when the work behind it is. Items
# at week 1 are the market context and the always-on surfaces; the rest appear in
# navigation from the start but stay locked until their week, which is what makes the
# progression legible rather than making the earlier weeks look unfinished.
# ---------------------------------------------------------------------------------------
product_capabilities:
  - id: market-overview
    name: Market overview
    href: /
    surfaces: [nav]
    enabled_from_week: 1
    summary: What the market did, read against the NIFTY 50.
  - id: index
    name: NIFTY 50
    href: /markets/nifty-50
    surfaces: [nav]
    enabled_from_week: 1
    summary: The benchmark everything else is read against.
  - id: instruments
    name: Instruments
    href: /markets
    surfaces: [nav]
    enabled_from_week: 1
    summary: Every instrument in the active universe.
  - id: evidence-explorer
    name: Evidence explorer
    href: /research/alignment
    surfaces: [nav]
    enabled_from_week: 1
    summary: Which evidence covers which sessions, and what may be combined.
  - id: multimodal-evidence
    name: Multimodal evidence
    href: /weeks/5
    surfaces: [nav]
    # Week 5, not week 3. A modality becomes evidence when its feature block enters the
    # dataset — text at 3, image at 5, audio at 7, video at 9 — and week 3 is still text
    # alone, which the product already had from week 1. Week 5 is the first week a reader
    # can read one instrument-day across two modalities, which is what this name promises.
    enabled_from_week: 5
    summary: Rendered market imagery as evidence, a second modality beside the text.
  - id: event-detection
    name: Event detection
    href: /weeks/8
    surfaces: [nav]
    enabled_from_week: 8
    summary: Episodes in the market, and the video evidence generated for them.
  - id: calibration
    name: Calibration
    href: /weeks/11
    surfaces: [nav]
    enabled_from_week: 11
    summary: Whether a stated confidence means what it says.
  - id: robustness
    name: Robustness
    href: /weeks/15
    surfaces: [nav]
    enabled_from_week: 15
    summary: What survives missing modalities and a different seed.
  - id: explainability
    name: Explainability
    href: /weeks/16
    surfaces: [nav]
    enabled_from_week: 16
    summary: Which evidence moved the answer, and how far that attribution holds.
  - id: scenario-lab
    name: Scenario Lab
    href: /scenario
    surfaces: [nav]
    enabled_from_week: 1
    summary: Observed conditions and counterfactuals, with refusals where evidence cannot support them.

  # --- surfaces: analysis -------------------------------------------------------------
  #
  # The sections of /analysis. The page itself is a permanent product destination and is
  # never gated; what it *contains* unlocks with the modules that produce it, which is why
  # these are declared here rather than decided in the page. A section reads its data only
  # when its capability is enabled, so a locked result never reaches the browser at all.
  - id: foundation-analysis
    name: Foundation analysis
    href: /analysis
    surfaces: [analysis]
    enabled_from_week: 1
    summary: What the evidence showed across the sample, read from the market overview.
  - id: text-evidence
    name: Text evidence
    href: /weeks/3
    surfaces: [analysis]
    enabled_from_week: 3
    summary: The financial text block as it enters the model.
  - id: image-evidence
    name: Image evidence
    href: /weeks/5
    surfaces: [analysis]
    enabled_from_week: 5
    summary: Rendered market imagery as a feature block.
  - id: audio-evidence
    name: Audio evidence
    href: /weeks/7
    surfaces: [analysis]
    enabled_from_week: 7
    summary: Sonified market state and its acoustic affect proxies.
  - id: video-evidence
    name: Video evidence
    href: /weeks/9
    surfaces: [analysis]
    enabled_from_week: 9
    summary: Rendered video and its temporal-difference features.
  - id: event-analysis
    name: Event analysis
    href: /weeks/8
    surfaces: [analysis]
    enabled_from_week: 8
    summary: Unusual market periods, their onset, peak and resolution.
  - id: contribution-analysis
    name: Evidence contribution analysis
    href: /weeks/14
    surfaces: [analysis]
    enabled_from_week: 14
    summary: What each kind of evidence uniquely added, by leave-one-out ablation.

weeks:
  - week: 1
    title: What the evidence base is made of
    question: >-
      Before any result: what rows exist, how completely are they covered, and what is the
      text stream actually composed of?
    stats_module: STATS-01
    multimodal_module: MULTIMODAL-01
    gate:
      capability: evidence-base
      enabled_from_week: 1
    summary: >-
      Structure first. The panel is profiled for coverage, key uniqueness and split sizes;
      the text corpus is scored for affect with its lexicon match rate attached. Both run
      over the slice you select rather than over a stored whole-panel figure.
    feature:
      product_question: >-
        What is every other number here built on?
      story: >-
        Profiles the rows behind the analysis and reads the text stream that accompanies
        them, so the size and completeness of the evidence base is known before anything
        is concluded from it.
      headline:
        - module: STATS-01
          metric: rows
          label: Instrument-sessions
        - module: STATS-01
          metric: instruments
          label: Instruments
        - module: MULTIMODAL-01
          metric: documents
          label: Documents
        - module: STATS-01
          metric: positive_rate
          label: Sessions inside an episode
      primary_visual:
        module: STATS-01
        series: block_coverage
        label_column: block
        value_column: mean_non_null_fraction
        kind: bars
        caption: >-
          How completely each kind of evidence is present on these rows.
      secondary_visual:
        module: MULTIMODAL-01
        series: affect_dimensions
        label_column: dimension
        value_column: mean
        kind: bars
        caption: >-
          What the text extractor found across the documents it scored.

  - week: 2
    title: Which instruments, and what the text says about them
    question: >-
      Is the instrument universe point-in-time, and how does extracted affect vary across
      the instruments in it?
    stats_module: STATS-02
    multimodal_module: MULTIMODAL-02
    gate:
      capability: return-behaviour
      enabled_from_week: 2
    summary: >-
      Universe membership and survivorship on one side, the affect distribution over the
      corpus on the other. Together they bound who is in the sample and what was said.
    feature:
      product_question: >-
        Which instruments does the analysis actually cover?
      story: >-
        Reconstructs which instruments were in the sample at each point in time, and
        reads the tone of the text written about them.
      headline:
        - module: STATS-02
          metric: ever
          label: Instruments ever covered
        - module: STATS-02
          metric: always
          label: Covered throughout
        - module: STATS-02
          metric: rebalances
          label: Reconstitutions
        - module: MULTIMODAL-02
          metric: scored
          label: Documents scored
      primary_visual:
        module: STATS-02
        series: churn
        label_column: rebalance_date
        value_column: members
        kind: line
        caption: >-
          How many instruments were in the sample at each reconstitution.
      secondary_visual:
        module: MULTIMODAL-02
        series: dimensions
        label_column: dimension
        value_column: mean
        kind: bars
        caption: >-
          Tone dimensions across the documents scored.

  - week: 3
    title: Distributions and the text feature block
    question: >-
      What do the numeric distributions look like, and how completely is the text block
      populated across them?
    stats_module: STATS-03
    multimodal_module: MULTIMODAL-03
    gate:
      capability: cross-section
      enabled_from_week: 3
    summary: >-
      Descriptive and distributional statistics beside per-feature presence for the text
      block, so a distribution is never read without knowing how many rows carry it.
    feature:
      product_question: >-
        How do the underlying measurements behave?
      story: >-
        Describes every feature on the selected rows and names the ones that cannot vary
        there, alongside how completely the text block is populated.
      headline:
        - module: STATS-03
          metric: features
          label: Features described
        - module: STATS-03
          metric: degenerate
          label: Constant on this slice
        - module: STATS-03
          metric: mean_fill
          label: Average completeness
        - module: MULTIMODAL-03
          metric: present
          label: Text features present
      primary_visual:
        module: STATS-03
        series: features
        label_column: feature
        value_column: non_null_fraction
        kind: bars
        caption: >-
          How completely each feature is populated, widest variation first.
      secondary_visual:
        module: MULTIMODAL-03
        series: features
        label_column: feature
        value_column: non_null_fraction
        kind: bars
        caption: >-
          The text block, feature by feature.

  - week: 4
    title: Microstructure proxies and rendered market imagery
    question: >-
      What do the liquidity and microstructure proxies show, and what does a chart
      rendered from the same window contain?
    stats_module: STATS-04
    multimodal_module: MULTIMODAL-04
    gate:
      capability: regimes
      enabled_from_week: 4
    summary: >-
      Microstructure-proxy statistics alongside the image pipeline. Rendered charts are
      derived from the market series; they are a second view of it, not evidence
      independent of it.
    feature:
      product_question: >-
        What were trading conditions like, and what does a chart of them contain?
      story: >-
        Reads the liquidity and microstructure proxies on the selected rows, and renders
        a chart from the same window to read back what a picture of it carries.
      headline:
        - module: STATS-04
          metric: market_features
          label: Market measures
        - module: STATS-04
          metric: proxy_features
          label: Liquidity proxies
        - module: STATS-04
          metric: not_measured
          label: Recorded as unmeasurable
        - module: MULTIMODAL-04
          metric: sessions
          label: Sessions rendered
      primary_visual:
        module: MULTIMODAL-04
        series: visual_affect
        label_column: dimension
        value_column: value
        kind: bars
        caption: >-
          What the image pipeline read back from the chart it rendered.

  - week: 5
    title: Regimes and the image feature block
    question: >-
      How are regimes distributed over the sample, and how completely is the image block
      populated?
    stats_module: STATS-05
    multimodal_module: MULTIMODAL-05
    gate:
      capability: propagation
      enabled_from_week: 5
    summary: >-
      Regime statistics with the image block per-feature coverage, so a regime-conditional
      reading knows how much visual signal existed under it.
    feature:
      product_question: >-
        What kind of market was this, and how much visual evidence existed under it?
      story: >-
        Shows how the selected sessions distribute across market regimes, with the
        completeness of the image evidence beside them.
      headline:
        - module: STATS-05
          metric: regimes
          label: Regimes present
        - module: STATS-05
          metric: largest_share
          label: Largest regime
        - module: STATS-05
          metric: smallest_rows
          label: Smallest regime, sessions
        - module: MULTIMODAL-05
          metric: present
          label: Image features present
      primary_visual:
        module: STATS-05
        series: occupancy
        label_column: regime_id
        value_column: share
        kind: bars
        caption: >-
          How the selected sessions divide between regimes.
      secondary_visual:
        module: MULTIMODAL-05
        series: features
        label_column: feature
        value_column: non_null_fraction
        kind: bars
        caption: >-
          The image block, feature by feature.

  - week: 6
    title: Dependence, propagation and sonified market state
    question: >-
      How does movement propagate across instruments, and what does the same state sound
      like once sonified?
    stats_module: STATS-06
    multimodal_module: MULTIMODAL-06
    gate:
      capability: co-movement
      enabled_from_week: 6
    summary: >-
      Dependence and propagation statistics with the sonification stage. Sonified audio is
      a rendering of the market series and contains no speech.
    feature:
      product_question: >-
        Did these instruments move together, and what does that sound like?
      story: >-
        Measures contemporaneous co-movement between the instruments you select, and
        sonifies the same window so the state can be heard as well as read.
      headline:
        - module: STATS-06
          metric: pairs
          label: Instrument pairs measured
        - module: STATS-06
          metric: median_abs_corr
          label: Typical association
        - module: STATS-06
          metric: sessions
          label: Sessions measured
        - module: MULTIMODAL-06
          metric: duration
          label: Seconds of audio
      primary_visual:
        module: STATS-06
        series: pairs
        label_column: instrument_b
        value_column: correlation
        kind: bars
        caption: >-
          The strongest associations on the sessions selected.
      secondary_visual:
        module: MULTIMODAL-06
        series: audio_affect
        label_column: dimension
        value_column: value
        kind: bars
        caption: >-
          Acoustic dimensions of the sonified window.

  - week: 7
    title: Tails and acoustic affect proxies
    question: >-
      How heavy are the tails on your slice, and what do the acoustic proxies derived from
      the same sessions look like?
    stats_module: STATS-07
    multimodal_module: MULTIMODAL-07
    gate:
      capability: tails
      enabled_from_week: 7
    summary: >-
      Tail and extreme-risk statistics beside prosody-style proxies computed from sonified
      audio. The proxies describe a rendering, not a speaker.
    feature:
      product_question: >-
        How extreme did moves get?
      story: >-
        Measures the tails of the realised next-session return over the selected window,
        with the acoustic evidence available beside it.
      headline:
        - module: STATS-07
          metric: n
          label: Returns measured
        - module: STATS-07
          metric: cvar
          label: Average loss in the worst 5%
        - module: STATS-07
          metric: vol_annual
          label: Annualised volatility
        - module: STATS-07
          metric: max_drawdown
          label: Deepest drawdown
      primary_visual:
        module: STATS-07
        series: tail
        label_column: statistic
        value_column: value
        kind: bars
        caption: >-
          Tail statistics over the sessions selected.
      secondary_visual:
        module: MULTIMODAL-07
        series: features
        label_column: feature
        value_column: non_null_fraction
        kind: bars
        caption: >-
          The audio block, feature by feature.

  - week: 8
    title: Episodes and generated video
    question: >-
      How are the injected episodes distributed, and what does the video stage produce from
      them?
    stats_module: STATS-08
    multimodal_module: MULTIMODAL-08
    gate:
      capability: detection
      enabled_from_week: 8
    summary: >-
      Episode and event statistics with the video generation stage. Episodes are injected
      by this project (L-04); they are labels of a construction, not observed incidents.
    feature:
      product_question: >-
        What unusual periods are in this data, and how were they constructed?
      story: >-
        Summarises the injected episodes overlapping the window, with the video
        generation stage that renders them.
      headline:
        - module: STATS-08
          metric: episodes
          label: Episodes in this window
        - module: STATS-08
          metric: instruments
          label: Instruments affected
        - module: STATS-08
          metric: label_rows
          label: Labelled sessions
        - module: STATS-08
          metric: intensity
          label: Mean injected intensity
      primary_visual:
        module: STATS-08
        series: episode_summary
        label_column: quantity
        value_column: value
        kind: bars
        caption: >-
          What the episode labels record.

  - week: 9
    title: Leakage verification and the video feature block
    question: >-
      Can information from after a decision time reach a feature, and how completely is the
      video block populated?
    stats_module: STATS-09
    multimodal_module: MULTIMODAL-09
    gate:
      capability: leakage
      enabled_from_week: 9
    summary: >-
      The leakage suite run over your slice, beside the video block coverage. A leakage
      check that passes on the whole panel can still be worth re-running on a subset.
    feature:
      product_question: >-
        Could the analysis have seen the future?
      story: >-
        Runs the timing-integrity suite now and reports what it found, with the
        completeness of the video evidence beside it.
      headline:
        - module: STATS-09
          metric: passed
          label: Checks passed
        - module: STATS-09
          metric: failed
          label: Checks failed
        - module: MULTIMODAL-09
          metric: present
          label: Video features present
        - module: MULTIMODAL-09
          metric: mean_fill
          label: Average completeness
      primary_visual:
        module: MULTIMODAL-09
        series: features
        label_column: feature
        value_column: non_null_fraction
        kind: bars
        caption: >-
          The video block, feature by feature.

  - week: 10
    title: Validation metrics and media licensing
    question: >-
      What do the validation metrics say at a threshold you choose, and what is the
      licensing status of every media reference?
    stats_module: STATS-10
    multimodal_module: MULTIMODAL-10
    gate:
      capability: attribution
      enabled_from_week: 10
    summary: >-
      Threshold-interactive validation metrics with the media licence register. Public
      accessibility is not permission to redistribute, and nothing with unknown status
      reaches an artifact.
    feature:
      product_question: >-
        How accurate is the signal, and may the media behind it be shared?
      story: >-
        Reports the confusion matrix at a threshold you choose, and classifies a media
        reference against the licence rules.
      headline:
        - module: STATS-10
          metric: n
          label: Sessions assessed
        - module: STATS-10
          metric: balanced_accuracy
          label: Balanced accuracy
        - module: STATS-10
          metric: mcc
          label: Matthews correlation
        - module: STATS-10
          metric: threshold
          label: Threshold applied
      primary_visual:
        module: STATS-10
        series: per_class
        label_column: class_name
        value_column: f1
        kind: bars
        caption: >-
          How well each class is recovered at this threshold.

  - week: 11
    title: Calibration and cross-modal alignment
    question: >-
      Are the scores calibrated at the bin count you choose, and what happens when the
      modalities are deliberately misaligned in time?
    stats_module: STATS-11
    multimodal_module: MULTIMODAL-11
    gate:
      capability: forecasting
      enabled_from_week: 11
    summary: >-
      Reliability computed over your chosen binning, beside a temporal-offset refit. Both
      let you change one parameter and watch the number move.
    feature:
      product_question: >-
        How confident should the signal be taken to be?
      story: >-
        Draws the reliability curve at a binning you choose, and measures what happens
        when one kind of evidence arrives late.
      headline:
        - module: STATS-11
          metric: ece
          label: Calibration error
        - module: STATS-11
          metric: bins
          label: Bins
        - module: STATS-11
          metric: n
          label: Sessions assessed
        - module: MULTIMODAL-11
          metric: loss
          label: Cost of a delay
      primary_visual:
        module: STATS-11
        series: reliability
        label_column: mean_pred
        value_column: observed
        kind: line
        caption: >-
          Predicted score against observed rate. A calibrated score would track the
          diagonal.
      secondary_visual:
        module: MULTIMODAL-11
        series: offsets
        label_column: offset_sessions
        value_column: auprc
        kind: line
        caption: >-
          What delaying one kind of evidence costs.

  - week: 12
    title: Error analysis and dataset assembly
    question: >-
      Where does the scoring fail, and how were the modality blocks joined into the panel
      that produced those failures?
    stats_module: STATS-12
    multimodal_module: MULTIMODAL-12
    gate:
      capability: calibration
      enabled_from_week: 12
    summary: >-
      Error analysis by segment beside the assembly report for the panel it ran on, so a
      failure mode can be traced to the join that produced its rows.
    feature:
      product_question: >-
        Where does the signal get it wrong?
      story: >-
        Classifies every mistake by kind, diagnosing missing evidence before model
        error, with the completeness of the assembled panel beside it.
      headline:
        - module: STATS-12
          metric: wrong
          label: Sessions misclassified
        - module: STATS-12
          metric: error_rate
          label: Error rate
        - module: STATS-12
          metric: classes
          label: Distinct failure modes
        - module: MULTIMODAL-12
          metric: complete_share
          label: Sessions with every kind of evidence
      primary_visual:
        module: STATS-12
        series: taxonomy
        label_column: error_class
        value_column: rows
        kind: bars
        caption: >-
          What kind of mistake, and how often.
      secondary_visual:
        module: MULTIMODAL-12
        series: blocks
        label_column: block
        value_column: row_share
        kind: bars
        caption: >-
          How often each kind of evidence was present at all.

  - week: 13
    title: Baselines and the fusion degeneracy proof
    question: >-
      How do the baselines compare, and what does attention fusion do when one modality is
      uninformative?
    stats_module: STATS-13
    multimodal_module: MULTIMODAL-13
    gate:
      capability: robustness
      enabled_from_week: 13
    summary: >-
      The baseline comparison is replayed from its protected artifact; the degeneracy proof
      is recomputed live at the temperature you choose. One is a record, the other is an
      argument you can rerun.
    feature:
      product_question: >-
        Is this better than something simpler, and does the combination method actually
        work?
      story: >-
        Replays the verified baseline comparison, and re-runs the proof that one way of
        combining evidence collapses into a simpler one.
      headline:
        - module: MULTIMODAL-13
          metric: max_diff
          label: Difference between the two methods
        - module: MULTIMODAL-13
          metric: rows
          label: Rows constructed
        - module: MULTIMODAL-13
          metric: modalities
          label: Kinds of evidence
        - module: MULTIMODAL-13
          metric: regime_sd
          label: Regime term made this large
      primary_visual:
        module: MULTIMODAL-13
        series: proof
        label_column: quantity
        value_column: value
        kind: bars
        caption: >-
          What the proof reports at the parameters chosen.

  - week: 14
    title: Ablation and modality information decomposition
    question: >-
      Which components carry the result, and how much of the information is unique to each
      modality rather than shared?
    stats_module: STATS-14
    multimodal_module: MULTIMODAL-14
    gate:
      capability: causal-reading
      enabled_from_week: 14
    summary: >-
      Ablation arms recomputed from their per-row score files, beside the unique, shared
      and synergistic decomposition over the same arms.
    feature:
      product_question: >-
        What is each part of the system actually contributing?
      story: >-
        Recomputes each configuration's quality on the rows you select, and decomposes
        how much each kind of evidence uniquely adds.
      headline:
        - module: STATS-14
          metric: arms
          label: Configurations compared
        - module: STATS-14
          metric: best_auprc
          label: Best quality
        - module: STATS-14
          metric: spread
          label: Spread across configurations
        - module: MULTIMODAL-14
          metric: top_unique
          label: Largest unique contribution
      primary_visual:
        module: STATS-14
        series: arms
        label_column: arm
        value_column: auprc
        kind: bars
        caption: >-
          Detection quality per configuration, on the rows selected.
      secondary_visual:
        module: MULTIMODAL-14
        series: decomposition
        label_column: modality
        value_column: unique
        kind: bars
        caption: >-
          What each kind of evidence contributes that nothing else does.

  - week: 15
    title: Robustness and modality missingness
    question: >-
      What survives perturbation, and what happens when a modality is simply absent?
    stats_module: STATS-15
    multimodal_module: MULTIMODAL-15
    gate:
      capability: aggregation
      enabled_from_week: 15
    summary: >-
      One perturbation condition run live against the modality-dropout results. Both are
      stress tests; neither is evidence of performance under a distribution not sampled
      here.
    feature:
      product_question: >-
        What happens when the data gets worse?
      story: >-
        Degrades the inputs one named failure mode at a time, and takes a whole kind of
        evidence offline, measuring both.
      headline:
        - module: STATS-15
          metric: clean_auprc
          label: Quality on clean data
        - module: STATS-15
          metric: degraded_auprc
          label: Quality when degraded
        - module: STATS-15
          metric: relative
          label: Share of quality lost
        - module: MULTIMODAL-15
          metric: loss
          label: Cost of losing a whole channel
      primary_visual:
        module: STATS-15
        series: conditions
        label_column: condition
        value_column: auprc
        kind: bars
        caption: >-
          Clean against degraded, measured the same way.
      secondary_visual:
        module: MULTIMODAL-15
        series: conditions
        label_column: condition
        value_column: auprc
        kind: bars
        caption: >-
          With every kind of evidence, against one taken offline.

  - week: 16
    title: Seeds, significance and explanation
    question: >-
      How much of the difference between arms is seed noise, and how faithful are the
      explanations attached to those scores?
    stats_module: STATS-16
    multimodal_module: MULTIMODAL-16
    gate:
      capability: the-whole-picture
      enabled_from_week: 16
    summary: >-
      The multi-seed noise floor recomputed over the seed table, beside the explanation
      benchmark. A gap smaller than the noise floor is not a finding.
    feature:
      product_question: >-
        Which differences are real, and can the system explain itself?
      story: >-
        Measures how much of the difference between configurations is just the random
        seed, and replays the explanation benchmark.
      headline:
        - module: STATS-16
          metric: floor
          label: Noise floor
        - module: STATS-16
          metric: pairs
          label: Comparisons tested
        - module: STATS-16
          metric: resolved
          label: Comparisons resolved
        - module: STATS-16
          metric: seeds
          label: Seeds per configuration
      primary_visual:
        module: STATS-16
        series: per_arm
        label_column: arm
        value_column: auprc_mean
        kind: bars
        caption: >-
          Average quality per configuration across seeds.

modules:

  # ------------------------------------------------------------------ STATS ----

  - id: STATS-01
    index: 1
    category: STATS
    slug: data_integrity_profile
    name: Data and integrity profile
    purpose: >-
      Report what the assembled dataset actually contains before any result is computed
      from it: row and column counts, per-block coverage, missing values, duplicate keys,
      class balance and the train/validation/holdout split sizes.
    research_question: >-
      Does the dataset satisfy the structural preconditions every downstream claim assumes,
      and where is coverage thin enough to bound a conclusion?
    canonical:
      - research/market/features.py::coverage_report
      - research/data/dataset.py::MODALITY_BLOCKS
    adapter: scripts.stages.stats:data_integrity_profile
    inputs:
      - data/panel/multimodal_dataset.parquet
    outputs:
      - outputs/stats/01_data_integrity_profile/profile.json
      - outputs/stats/01_data_integrity_profile/block_coverage.csv
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: [L-12]
    notes: >-
      Reports counts and coverage only. Formal leakage verification is STATS-09; the
      confusion-matrix-level validation suite is STATS-10 and is not implemented yet.
    ui:
      icon: ▤
      product_name: What the data contains
      route: /stats/data-integrity
      product_headline: What the dataset actually contains
      product_question: Is the data underneath every other number complete enough to build on?
      product_actions:
      - Read row, column and split counts before trusting any result
      - See which modality blocks are thinly covered
      - Check that no duplicate key exists
      product_observation: Every declared feature block is present and the key is unique. Coverage
        is uneven across blocks, which bounds what any single result can be read to cover.
      product_risk: Counts and coverage only. This module checks structure, not correctness;
        leakage is checked separately in Leakage verification.
      confidence: HIGH
      visual: coverage_bars
      product_metrics:
      - label: Rows
        value: json:outputs/stats/01_data_integrity_profile/profile.json#rows
        format: int
        note: modelling panel rows
      - label: Columns
        value: json:outputs/stats/01_data_integrity_profile/profile.json#columns
        format: int
        note: features plus metadata
      - label: Instruments
        value: json:outputs/stats/01_data_integrity_profile/profile.json#instruments
        format: int
        note: distinct symbols
      - label: Duplicate keys
        value: json:outputs/stats/01_data_integrity_profile/profile.json#duplicate_keys
        format: int
        note: zero is the only acceptable value
      - label: Positive rate
        value: json:outputs/stats/01_data_integrity_profile/profile.json#positive_rate
        format: pct
        note: share of rows inside an injected episode
      research_metrics:
      - label: Train rows
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.train
        format: int
      - label: Validation rows
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.validation
        format: int
      - label: Holdout rows (frozen)
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.holdout
        format: int
      - label: Blocks profiled
        value: csv:outputs/stats/01_data_integrity_profile/block_coverage.csv#rows
        format: int
      figures:
      - figR01_corpus_composition
      tables:
      - table01_dataset_composition
      inputs:
      - kind: dataset
        label: Dataset
        note: 'The assembled modelling panel. Fixed: the product reads exported artifacts and
          never rebuilds a dataset.'
    analysis:
      adapter: scripts.stages.stats:analyse_data_integrity
      mode: LIVE
      typical_seconds: 1.5
      summary: >-
        Profiles the rows you select, now. Block coverage, key uniqueness, split sizes
        and episode rate are recomputed over the selected slice by the same functions
        the regenerating adapter uses; nothing is read from a stored profile.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-04-07'
          maximum: '2026-08-14'
          note: first session included in the profile
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-04-07'
          maximum: '2026-08-14'
          note: last session included in the profile
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: leave empty to profile every instrument in the range
        - name: split
          kind: select
          label: Split
          default: all
          options: [all, train, validation, holdout]
          note: >-
            the holdout is included in counts and is never scored; selecting it profiles
            its structure only

  - id: STATS-02
    index: 2
    category: STATS
    slug: universe_survivorship
    name: Universe and survivorship statistics
    purpose: >-
      Characterise the point-in-time liquidity-proxy universe: membership over time, churn
      per rebalance, distinct members ever selected, and the turnover statistics that make
      the construction survivorship-safe.
    research_question: >-
      How much does the research universe turn over, and what does that imply for any
      result read as applying to a stable large-cap index?
    canonical:
      - research/data/universe.py::LiquidityProxyUniverse.churn
      - research/data/universe.py::LiquidityProxyUniverse.turnover_stats
    adapter: scripts.stages.stats:universe_survivorship
    inputs:
      - data/panel/universe.parquet
    outputs:
      - outputs/stats/02_universe_survivorship/universe_summary.json
      - outputs/stats/02_universe_survivorship/churn.csv
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-01]
    notes: >-
      The universe is a liquidity proxy, never the Nifty 50. L-01 records why licence-clear
      point-in-time index membership was not obtainable.
    ui:
      icon: ◎
      product_name: Which instruments are covered
      route: /stats/universe
      product_headline: Which instruments are in scope, and how that changed
      product_question: How much does the research universe turn over, and what does that mean
        for a result read as applying to a stable index?
      product_actions:
      - See the membership rule and the rebalance cadence
      - Read churn per rebalance and distinct members ever selected
      - Check the survivorship position before quoting any universe-level number
      product_observation: The universe is a point-in-time liquidity proxy rebuilt at every
        rebalance from sessions strictly before it, so it carries no survivorship advantage.
      product_risk: This is not the Nifty 50 and must never be described as it. No licence-clear
        point-in-time index membership was obtainable (L-01).
      confidence: HIGH
      visual: stat_row
      product_metrics:
      - label: Rebalances
        value: json:outputs/stats/02_universe_survivorship/universe_summary.json#rebalances
        format: int
        note: monthly reconstruction points
      - label: Distinct members ever
        value: json:outputs/stats/02_universe_survivorship/universe_summary.json#distinct_members_ever
        format: int
        note: for a 50-name universe
      - label: Members per rebalance
        value: json:outputs/stats/02_universe_survivorship/universe_summary.json#members_per_rebalance_mean
        format: float1
        note: constant by construction
      - label: Entries per rebalance
        value: json:outputs/stats/02_universe_survivorship/universe_summary.json#mean_entries_per_rebalance
        format: float2
        note: instruments joining
      - label: Exits per rebalance
        value: json:outputs/stats/02_universe_survivorship/universe_summary.json#mean_exits_per_rebalance
        format: float2
        note: instruments leaving
      research_metrics:
      - label: Index membership
        value: json:outputs/stats/02_universe_survivorship/universe_summary.json#is_index_membership
        format: bool
      - label: Churn rows
        value: csv:outputs/stats/02_universe_survivorship/churn.csv#rows
        format: int
      - label: Caveat
        value: json:outputs/stats/02_universe_survivorship/universe_summary.json#caveat
        format: text
      figures:
      - fig06_universe
      tables:
      - table11_dataset_provenance
      inputs:
      - kind: universe
        label: Universe
        note: The active point-in-time liquidity proxy. One universe exists; alternatives are
          an open research question (EXP-L01-1).
    analysis:
      adapter: scripts.stages.stats:analyse_universe
      mode: LIVE
      typical_seconds: 0.6
      summary: >-
        Reconstructs membership and churn across the rebalances inside your window.
        Survivorship is a property of a window rather than of a dataset, so the answer
        changes with the window and is computed for the one you choose.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2018-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first rebalance included
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last rebalance included

  - id: STATS-03
    index: 3
    category: STATS
    slug: descriptive_distributions
    name: Descriptive and distributional statistics
    purpose: >-
      Per-feature descriptive statistics across all 99 features, grouped by modality block,
      with the fraction present and the number of distinct values so degenerate features
      are visible rather than silently averaged into a model.
    research_question: >-
      Which features carry usable variation, and which are so degenerate that any
      importance attributed to them should be discounted?
    canonical:
      - research/data/dataset.py::MODALITY_BLOCKS
      - research/data/dataset.py::ALL_FEATURES
    adapter: scripts.stages.stats:descriptive_distributions
    inputs:
      - data/panel/multimodal_dataset.parquet
    outputs:
      - outputs/stats/03_descriptive_distributions/feature_summary.csv
      - outputs/stats/03_descriptive_distributions/degenerate_features.csv
    depends_on: [STATS-01]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: >-
      A degenerate entropy feature was found this way once before: quantile binning had
      pinned it near-constant. Reporting distinct-value counts keeps that failure visible.
    ui:
      icon: ∑
      product_name: How the numbers behave
      route: /stats/distributions
      product_headline: Which features carry usable variation
      product_question: Which features actually vary, and which are so degenerate that any importance
        attributed to them should be discounted?
      product_actions:
      - Scan per-feature spread and distinct-value counts by modality block
      - Find degenerate features before reading a feature-importance chart
      - Check the fraction present per feature
      product_observation: Distinct-value counts are reported beside every mean, so a feature
        that quantile binning has pinned near-constant is visible rather than silently averaged
        into a model.
      product_risk: Descriptive only. A feature with wide spread is not thereby informative,
        and this module makes no claim that it is.
      confidence: HIGH
      visual: feature_table
      product_metrics:
      - label: Features profiled
        value: csv:outputs/stats/03_descriptive_distributions/feature_summary.csv#rows
        format: int
        note: across all modality blocks
      - label: Degenerate features
        value: csv:outputs/stats/03_descriptive_distributions/degenerate_features.csv#rows
        format: int
        note: too few distinct values to carry information
      - label: Mean fraction present
        value: csv:outputs/stats/03_descriptive_distributions/feature_summary.csv#agg:non_null_fraction:mean
        format: pct
        note: averaged over features
      research_metrics:
      - label: Minimum fraction present
        value: csv:outputs/stats/03_descriptive_distributions/feature_summary.csv#agg:non_null_fraction:min
        format: pct
      - label: Fewest distinct values
        value: csv:outputs/stats/03_descriptive_distributions/feature_summary.csv#agg:n_distinct:min
        format: int
      figures: []
      tables: []
      inputs:
      - kind: block
        label: Modality block
        note: Filter the feature table by block. The blocks are declared in research/data/dataset.py
          and are not editable here.
    analysis:
      adapter: scripts.stages.stats:analyse_distributions
      mode: LIVE
      typical_seconds: 1.5
      summary: >-
        Describes every numeric feature on the rows you select, and names the ones that
        are constant there. A feature that cannot vary on this slice cannot inform
        anything computed from it, however useful it is elsewhere.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first session described
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last session described
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range
        - name: block
          kind: select
          label: Feature block
          default: all
          options:
            - all
            - text
            - image
            - audio
            - video
            - market
            - microstructure
            - regime
            - propagation
          note: >-
            restrict the description to one modality block
        - name: split
          kind: select
          label: Split
          default: all
          options:
            - all
            - train
            - validation
            - holdout
          note: >-
            the frozen holdout is described but never scored

  - id: STATS-04
    index: 4
    category: STATS
    slug: market_microstructure
    name: Market and microstructure-proxy statistics
    purpose: >-
      Coverage and behaviour of the 18 market features and the 4 microstructure proxies,
      together with the explicit register of microstructure quantities that are NOT
      MEASURED because daily bhavcopy cannot support them.
    research_question: >-
      How much microstructure information do daily proxies retain relative to genuine
      order-book data, and what is provably absent?
    canonical:
      - research/market/features.py::MARKET_FEATURES
      - research/market/features.py::MICROSTRUCTURE_PROXIES
      - research/market/features.py::MICROSTRUCTURE_NOT_MEASURED
      - research/market/features.py::coverage_report
    adapter: scripts.stages.stats:market_microstructure
    inputs:
      - data/panel/multimodal_dataset.parquet
    outputs:
      - outputs/stats/04_market_microstructure/market_coverage.csv
      - outputs/stats/04_market_microstructure/not_measured.json
    depends_on: [STATS-01]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: [L-02]
    notes: >-
      Daily-bar proxies must never be described as true order-book microstructure (L-02).
    ui:
      icon: ⌗
      product_name: Liquidity and trading conditions
      route: /stats/microstructure
      product_headline: What the daily proxies can and cannot see
      product_question: How much microstructure information do daily proxies retain, and what
        is provably absent?
      product_actions:
      - Read the coverage of the market and microstructure-proxy features
      - Read the register of quantities that are NOT MEASURED, and why
      - Check this page before reading any microstructure-flavoured result
      product_observation: Six microstructure quantities are recorded as NOT MEASURED with the
        reason for each. Daily bars cannot support them, and no proxy is presented as if it
        could.
      product_risk: Daily-bar proxies are not order-book microstructure and must never be described
        as such (L-02).
      confidence: LOW
      visual: not_measured
      product_metrics:
      - label: Market features
        value: csv:outputs/stats/04_market_microstructure/market_coverage.csv#rows
        format: int
        note: market and proxy features profiled
      - label: Quantities not measured
        value: json:outputs/stats/04_market_microstructure/not_measured.json#not_measured
        format: count
        note: each with a recorded reason
      - label: Mean fraction present
        value: csv:outputs/stats/04_market_microstructure/market_coverage.csv#agg:non_null_fraction:mean
        format: pct
        note: over the profiled features
      research_metrics:
      - label: Caveat
        value: json:outputs/stats/04_market_microstructure/not_measured.json#caveat
        format: text
      figures: []
      tables: []
    analysis:
      adapter: scripts.stages.stats:analyse_microstructure
      mode: LIVE
      typical_seconds: 1.2
      summary: >-
        Coverage and dispersion of the market and microstructure-proxy features on your
        rows, beside the register of order-book quantities daily bars cannot express at
        all. The second list is the boundary of the first.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first session described
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last session described
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range

  - id: STATS-05
    index: 5
    category: STATS
    slug: regime_statistics
    name: Regime statistics
    purpose: >-
      Occupancy, persistence and transition structure of the detected market regimes as
      they appear in the assembled dataset.
    research_question: >-
      Are the detected regimes stable and well-populated enough for regime-conditioned
      results to be interpretable?
    canonical:
      - research/regime/detection.py::index_descriptors
      - research/regime/detection.py::select_order
      - research/regime/detection.py::bootstrap_stability
    adapter: scripts.stages.stats:regime_statistics
    inputs:
      - data/panel/multimodal_dataset.parquet
    outputs:
      - outputs/stats/05_regime_statistics/regime_occupancy.csv
    depends_on: [STATS-01]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: EXP-N02-1
    limitations: []
    notes: >-
      Regime-conditioned fusion is a measured negative result (N-02); this module reports
      the regime structure, not the fusion outcome.
    ui:
      icon: ◑
      product_name: Market regimes
      route: /stats/regimes
      product_headline: How the market regimes are populated
      product_question: Are the detected regimes stable and well-populated enough for a regime-conditioned
        result to be interpretable?
      product_actions:
      - See how many rows fall in each regime
      - Compare the episode rate across regimes
      - Check occupancy before reading a per-regime number
      product_observation: 'Occupancy is uneven: the largest regime holds the majority of rows
        while the smallest holds few enough that per-regime parameters inflate variance.'
      product_risk: A thinly populated regime is why the regime-conditioned fusion arm scores
        below static attention (N-02). Occupancy bounds every per-regime reading.
      confidence: MODERATE
      visual: regime_bars
      product_metrics:
      - label: Regimes detected
        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#rows
        format: int
        note: states in the fitted model
      - label: Largest regime share
        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#agg:share:max
        format: pct
        note: occupancy of the most common state
      - label: Smallest regime share
        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#agg:share:min
        format: pct
        note: occupancy of the least common state
      research_metrics:
      - label: Highest episode rate in a regime
        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#agg:positive_rate:max
        format: pct
      - label: Lowest episode rate in a regime
        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#agg:positive_rate:min
        format: pct
      figures:
      - fig07_regimes
      - fig12b_regime_degeneracy
      tables: []
    analysis:
      adapter: scripts.stages.stats:analyse_regimes
      mode: LIVE
      typical_seconds: 1.2
      summary: >-
