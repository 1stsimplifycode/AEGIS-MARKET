      that genuinely satisfied a stated condition: the most volatile fifth of sessions, and
      the thinnest fifth by Amihud illiquidity.'
    research_question: Does the risk estimate read differently on sessions that were really
      stressed, and is the difference separated from zero?
    canonical:
