  # ----------------------------------------------------------- HUMAN_AFFECT ----
  # Stream B. ADDITIVE: the approved 16 STATS + 16 MULTIMODAL research mapping is
  # untouched. These modules never process market-derived media, and the market
  # pipeline never processes human media; the gates in research/human_affect/guards.py
  # enforce that in both directions.

  - id: HUMAN_AFFECT-01
    index: 1
    category: HUMAN_AFFECT
    slug: dataset_registry
    name: Human-affective dataset registry
    purpose: >-
      Register candidate human-affective corpora with their source, believed licence,
      annotation scheme, domain and acquisition route, and gate any use behind local
      licence verification.
    research_question: >-
      Which licence-clear corpora can support human affective research here, and what
      exactly is missing for the financial-media domain?
    canonical:
      - research/human_affect/registry.py
    adapter: scripts.stages.human_affect:dataset_registry
    inputs: []
    outputs:
      - outputs/human_affect/01_dataset_registry/datasets.json
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: [L-06]
    notes: >-
      No media is downloaded or committed. A licence recorded in the registry is a
      pointer to what must be read, not a verified fact, and assert_usable() refuses any
      dataset whose licence has not been verified locally. No licence-clear,
      affect-annotated financial audiovisual corpus has been identified; that gap is
      registered explicitly rather than omitted.

  - id: HUMAN_AFFECT-02
    index: 2
    category: HUMAN_AFFECT
    slug: stream_separation_audit
    name: Stream A / Stream B separation audit
    purpose: >-
      Execute the gates that keep market-derived media out of the human affective
      pipelines and human media out of the market pipeline, and record that they fired.
    research_question: >-
      Can a rendered chart or a market sonification reach a human affective model by any
      path?
    canonical:
      - research/human_affect/guards.py
    adapter: scripts.stages.human_affect:stream_separation_audit
    inputs: []
    outputs:
      - outputs/human_affect/02_stream_separation_audit/stream_separation.json
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: >-
      Checked against this repository's own sonifier output rather than a mock. Also
      verifies that the prohibited inferences are refused and that a legitimate purpose
      is still allowed, so the gate is not a blanket refusal.

  - id: HUMAN_AFFECT-03
    index: 3
    category: HUMAN_AFFECT
    slug: audio_ingestion
    name: Human audio ingestion
    purpose: >-
      Ingest human speech into timestamped segments of derived features, recording
      provenance by hash and never copying raw media into the repository.
    research_question: >-
      What affective evidence is recoverable from a segment of real financial speech, and
      at what temporal resolution?
    canonical:
      - research/human_affect/ingest.py
      - research/human_affect/quality.py
    adapter: scripts.stages.human_affect:audio_ingestion
    inputs: []
    outputs:
      - outputs/human_affect/03_audio_ingestion/ingestion.json
    depends_on: [HUMAN_AFFECT-01]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-06]
    notes: >-
      Executes on real human speech from RAVDESS (CC BY-NC-SA 4.0), whose licence was
      read from Zenodo's own machine-readable metadata at download time rather than from
      secondary description. Falls back to a labelled synthetic fixture only when no
      corpus is present locally, and the artifact records which of the two happened.

  - id: HUMAN_AFFECT-04
    index: 4
    category: HUMAN_AFFECT
    slug: speech_affect_pipeline
    name: Speech prosody and acoustic affect
    purpose: >-
      Voice activity detection, twenty-two prosodic and spectral descriptors, and a
      dimensional affective representation reported with its uncertainty.
    research_question: >-
      Do acoustic correlates of arousal and tension in financial speech carry information
      beyond the linguistic content of what was said?
    canonical:
      - research/human_affect/speech.py
    adapter: scripts.stages.human_affect:speech_affect_pipeline
    inputs: []
    outputs:
      - outputs/human_affect/04_speech_affect_pipeline/speech_affect.json
    depends_on: [HUMAN_AFFECT-03]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: [L-05, L-06]
    notes: >-
      The dimensional mapping is a declared, uncalibrated heuristic over documented
      acoustic correlates, not a trained model, and its uncertainty floors say so.
      Categorical emotion classification raises rather than guessing: it needs a
      classifier trained on a licence-verified annotated corpus.

  - id: HUMAN_AFFECT-05
    index: 5
    category: HUMAN_AFFECT
    slug: video_ingestion
    name: Human video ingestion
    purpose: >-
      Sample frames at a fixed rate and assess per-frame quality (resolution, exposure,
      contrast, focus) before any facial analysis is attempted.
    research_question: >-
      How much usable facial evidence survives the recording conditions of real financial
      media?
    canonical:
      - research/human_affect/ingest.py
      - research/human_affect/quality.py
    adapter: scripts.stages.human_affect:video_ingestion
    inputs: []
    outputs:
      - outputs/human_affect/05_video_ingestion/video_ingestion.json
    depends_on: [HUMAN_AFFECT-01]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-09]
    notes: >-
      Frame sampling and per-frame quality assessment execute on real RAVDESS video
      (CC BY-NC-SA 4.0), fetched by scripts/fetch_affective_data.py. Copyrighted
      broadcast footage is never downloaded or redistributed; the corpus used here is
      openly licensed and is referenced by checksum rather than copied into outputs.

  - id: HUMAN_AFFECT-06
    index: 6
    category: HUMAN_AFFECT
    slug: face_expression_pipeline
    name: Facial expression pipeline
    purpose: >-
      Face detection, expression descriptors within the detected region, and temporal
      dynamics across a frame sequence.
    research_question: >-
      Do facial-expression-related signals in financial media carry information
      complementary to speech and text?
    canonical:
      - research/human_affect/face.py
    adapter: scripts.stages.human_affect:face_expression_pipeline
    inputs: []
    outputs:
      - outputs/human_affect/06_face_expression_pipeline/face_expression.json
    depends_on: [HUMAN_AFFECT-05]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-08, L-09]
    notes: >-
      Detection, quality assessment, landmark geometry, expression descriptors and
      temporal dynamics all execute on real human video. The detector is YuNet from the
      OpenCV model zoo (MIT); OpenCV 5 removed CascadeClassifier and ships no Haar
      cascades, which the first implementation assumed. Expression features are
      five-landmark geometry normalised by inter-ocular distance, so they are invariant
      to camera distance. No heuristic detector fallback exists on purpose: one would
      return boxes on a chart as readily as on a face. Nothing here computes an identity
      representation.

  - id: HUMAN_AFFECT-07
    index: 7
    category: HUMAN_AFFECT
    slug: multimodal_fusion
    name: Audiovisual fusion and modality ablation
    purpose: >-
      Late fusion over calibrated posteriors from real human speech, real human video and
      the lexical channel, with every non-empty modality subset scored on the same
      held-out actors.
    research_question: >-
      Does combining modalities recover affect that no single modality recovers alone, and
      what happens when one of them carries no information at all?
    canonical:
      - research/human_affect/fusion.py
      - scripts/run_human_affect_fusion.py
    adapter: scripts.stages.human_affect:multimodal_fusion
    inputs:
      - outputs/human_affect/experiments/fusion.json
    outputs:
      - outputs/human_affect/07_multimodal_fusion/multimodal_fusion.json
    depends_on: [HUMAN_AFFECT-04, HUMAN_AFFECT-06]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-08, L-09]
    notes: >-
      Audio and video are joined on clip identity, so the pair is the same utterance by
      the same actor recorded simultaneously rather than two recordings matched by label.
      The RAVDESS lexical channel is included as a deliberately uninformative arm: the
      corpus speaks two fixed sentences, so a fusion scheme that cannot absorb it without
      losing accuracy is fragile in a way an audio-plus-video table would not reveal.

  - id: HUMAN_AFFECT-08
    index: 8
    category: HUMAN_AFFECT
    slug: robustness_fairness
    name: Corruption robustness and subgroup performance
    purpose: >-
      Degrade the real waveforms and the real pixels, re-run the whole feature pipeline,
      and report performance across the metadata the corpus actually publishes.
    research_question: >-
      How much affective performance survives a genuinely degraded recording, and is that
      loss shared evenly across speakers?
    canonical:
      - research/human_affect/fusion.py
      - scripts/run_human_affect_fusion.py
    adapter: scripts.stages.human_affect:robustness_and_fairness
    inputs:
      - outputs/human_affect/experiments/robustness.json
      - outputs/human_affect/experiments/fairness.json
    outputs:
      - outputs/human_affect/08_robustness_fairness/robustness_fairness.json
    depends_on: [HUMAN_AFFECT-07]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-08, L-09]
    notes: >-
      Corruption is applied to the signal and the entire feature pipeline is re-run, so a
      degradation here is a degradation of the real recording rather than of a feature
      vector. Random corruption only: adversarial robustness needs an attacker model and
      is NOT RUN. Subgroups are actor sex, emotional intensity and spoken statement, the
      only attributes RAVDESS publishes; a gap whose Wilson intervals overlap is reported
      as unestablished rather than as unfairness. No demographic attribute is invented.

  - id: CORPUS-05
    index: 5
    category: CORPUS
    slug: synthetic_degradation
    name: Why synthetic augmentation degrades performance
    purpose: >-
      Test seven candidate mechanisms against each other to explain the measured collapse
      under synthetic augmentation.
    research_question: >-
      Is the degradation caused by distributional distance, or by something distributional
      distance does not measure?
    canonical:
      - scripts/diagnose_synthetic_degradation.py
    adapter: scripts.stages.corpus:synthetic_degradation
    inputs:
      - outputs/corpus/synthetic_degradation_diagnosis.json
    outputs:
      - outputs/corpus/05_synthetic_degradation/diagnosis.json
    depends_on: [CORPUS-03]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    execution: VERIFIED
    experiment_id: null
    limitations: []
    notes: >-
      Six mechanisms are ruled out with the number that rules each one out: marginals,
      class balance, covariance, mode collapse, feature range and coverage-flag damage.
      The supported mechanism is interaction loss -- a tree ensemble separates real from
      generated at AUC 0.9639 while a linear model reaches 0.4952, which is chance. A
      linear model can only use first- and second-order structure, so that gap is exactly
      the structure a Gaussian copula cannot carry. This does not tune the generator to
      improve the headline number; it explains the number that was measured.

  - id: CORPUS-06
    index: 6
    category: CORPUS
    slug: paper_artifacts
    name: Paper tables and figures
    purpose: >-
      Generate every paper table and figure from executed artifacts, recording any that
      cannot be produced together with the command that would produce them.
    research_question: >-
      Can every published table and figure be regenerated from artifacts on disk?
    canonical:
      - scripts/generate_paper_tables.py
      - scripts/generate_research_figures.py
    adapter: scripts.stages.corpus:paper_artifacts
    inputs: []
    outputs:
      - outputs/paper_tables/tables.json
      - outputs/research_figures/figures.json
    depends_on: [CORPUS-01, CORPUS-04]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    execution: VERIFIED
    experiment_id: null
    limitations: []
    notes: >-
      A table or figure whose source artifact is missing is recorded as NOT GENERATED with
      the command that would produce it, never emitted empty: an empty table in a paper
      directory reads as a result of zero, and a placeholder figure is indistinguishable
      from a real one.

  - id: SCENARIO-01
    index: 1
    category: SCENARIO
    slug: scenario_catalogue
    name: Scenario catalogue
    purpose: Emit every declared scenario as a record carrying its baseline, its intervention
      assumption, the features it affects, its constraints, its expected effect and the simulation
      method by which its rows are obtained, and refuse any scenario that omits one of them.
    research_question: Can every scenario in this project be reported together with the assumption
      it rests on, or is there one whose result could be quoted bare?
    canonical:
    - research/scenario/spec.py::ScenarioSpec
    - research/scenario/market.py::CATALOGUE
    - research/scenario/transactions.py::CATALOGUE
    adapter: scripts.stages.scenario:scenario_catalogue
    inputs: []
    outputs:
    - outputs/scenario/scenario_catalogue.json
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: A scenario is a record rather than a function precisely so that the catalogue can
      be serialised, diffed and shown beside its results. The module fails rather than warns
      when a scenario is unreportable.
    ui:
      icon: ◇
      product_name: The scenario catalogue
      route: /scenario/catalogue
      product_headline: Every condition the lab can put the model under
      product_question: What conditions are declared, what does each assume, and which of them
        actually happened?
      product_actions:
      - Read the assumption behind every scenario before reading its result
      - See which conditions are observed strata and which are counterfactual
      - Check that each scenario names the features it changes
      product_observation: Sixteen conditions across two domains. Six select rows that really
        occurred, six alter rows under a stated assumption, and four change a declared decision
        policy while leaving rows and model untouched.
      product_risk: A counterfactual is not an event. Six of these conditions never occurred,
        and each one carries the assumption under which its result would apply (L-24).
      confidence: HIGH
      visual: stat_row
      product_metrics:
      - label: Scenarios declared
        value: json:outputs/scenario/scenario_catalogue.json#n_scenarios
        format: int
        note: across market and transaction domains
      - label: Observed conditions
        value: json:outputs/scenario/scenario_catalogue.json#by_method.OBSERVED_STRATUM
        format: int
        note: rows are selected, never altered
      - label: Counterfactual conditions
        value: json:outputs/scenario/scenario_catalogue.json#by_method.COUNTERFACTUAL
        format: int
        note: rows altered under a stated assumption
      - label: Policy comparisons
        value: json:outputs/scenario/scenario_catalogue.json#by_method.POLICY_COUNTERFACTUAL
        format: int
