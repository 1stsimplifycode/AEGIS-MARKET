    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: []
    notes: >-
      This suite is blocking in CI and decides whether any other result may be believed.
      It runs read-only and writes no research artifact.
    ui:
      icon: ⛨
      product_name: Timing integrity
      route: /stats/leakage
      product_headline: Whether any result saw the future
      product_question: Does any feature, split or threshold use information that was not available
        at the time of the decision?
      product_actions:
      - Read the outcome of the blocking leakage suite
      - See which six leakage classes are checked
      - Treat a failure here as invalidating everything downstream
      product_observation: The leakage suite passes. It is blocking in continuous integration
        because a non-zero return code invalidates every downstream result.
      product_risk: A passing suite bounds the leakage classes it checks and no others. It is
        a necessary condition, not a certificate.
      confidence: HIGH
      visual: gate
      product_metrics:
      - label: Suite outcome
        value: json:outputs/stats/09_leakage_verification/leakage_report.json#summary
        format: text
        note: pytest result for tests/leakage
